    // ===== audio =====
    let AC = null,
      MG = null;

    function au() {
      if (!AC) {
        try {
          AC = new(window.AudioContext || window.webkitAudioContext)();
          MG = AC.createGain();
          MG.gain.value = .8;
          MG.connect(AC.destination)
        } catch (e) {}
      }
      if (AC && AC.state === 'suspended') AC.resume()
    }

    function note(f, d, type, v, at, slide = 0) {
      if (S.muted || !AC) return;
      const o = AC.createOscillator(),
        g = AC.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, at);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), at + d);
      g.gain.setValueAtTime(v, at);
      g.gain.exponentialRampToValueAtTime(.0008, at + d);
      o.connect(g);
      g.connect(MG);
      o.start(at);
      o.stop(at + d + .02)
    }

    function tone(f, d, type = 'square', v = .06, slide = 0, delay = 0) {
      if (AC) note(f, d, type, v, AC.currentTime + delay, slide)
    }

    function noise(d, v = .12) {
      if (S.muted || !AC) return;
      const b = AC.createBuffer(1, AC.sampleRate * d | 0, AC.sampleRate),
        a = b.getChannelData(0);
      for (let i = 0; i < a.length; i++) a[i] = (vrand() * 2 - 1) * (1 - i / a.length);
      const s = AC.createBufferSource(),
        g = AC.createGain();
      s.buffer = b;
      g.gain.value = v;
      s.connect(g);
      g.connect(MG);
      s.start()
    }
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    let lastS = {};
    const lim = (k, ms) => {
      const n = performance.now();
      if (lastS[k] && n - lastS[k] < ms) return false;
      lastS[k] = n;
      return true
    };

      shoot: () => lim('sh', 70) && tone(700, .05, 'square', .025, -300),
      hit: () => lim('hi', 45) && noise(.04, .05),
      kill: () => lim('k', 40) && tone(300 + vrand() * 200, .07, 'triangle', .05, -150),

      gold: () => lim('go', 60) && [1046, 1568].forEach((f, i) => tone(f, .07, 'square', .04, 0, .04 * i)),

          m = sg.mel[mstep % 16];
        if (b) note(mf(b), st * .9, 'triangle', .045, mnext);

        if (mstep % 4 === 0) noise(.03, .025);
        if (sg.perc && mstep % 2 === 1) note(mf(84 + (mstep % 3) * 3), .04, 'square', .012, mnext);

          r = Math.random() * s;
        for (const o of pool) {
          r -= o.wt;
          if (r <= 0) {
            pick.push(o);
            pool = pool.filter(q => q !== o);
            break
          }
        }
      }
      if (pick.length < n) {
        const hpf = G.p.hp / G.p.mhp,
          fw = hpf < .3 ? 4 : hpf < .6 ? 2 : .7,
          iw = k => (((G.inf || {})[k] || 0) >= INF[k].cap ? .35 : 1);
        // mixed fill pool: endless upgrades + Coin Sack + Royal Feast (Feast weighted by missing HP)
        let mix = Object.keys(INF).map(k => ({
          o: {
            k,
            kind: 'i'
          },
          w: iw(k)
        })).concat([{
          o: {
            k: 'gold',
            kind: 'x'
          },
          w: .8
        }, {
          o: {
            k: 'heal',
            kind: 'x'
          },
          w: fw
        }]);
        const draw = list => {
          let sum = list.reduce((a, q) => a + q.w, 0),
            r = Math.random() * sum;
          for (const q of list) {
            r -= q.w;
            if (r <= 0) return q
          }
          return list[list.length - 1]
        };
        if (Math.random() < .8) {
          const q = draw(mix.filter(q => q.o.kind === 'x'));
          pick.push(q.o);
          mix = mix.filter(m => m !== q)
        }
        while (pick.length < n && mix.length) {
          const q = draw(mix);
          pick.push(q.o);
          mix = mix.filter(m => m !== q)
        }
      }
      return pick
    }

    function openChoice(src) {
      G.choice = {
        cards: cards(),
        t: 0,
        src
      };
      sfx.lvl();
      vib([20, 30, 20])
    }

    function choose(c) {
      if (c.kind === 'i') {
        G.inf = G.inf || {};
        G.inf[c.k] = (G.inf[c.k] || 0) + 1;
        if (c.k === 'hp') {
          const v = (G.inf.hp > INF.hp.cap ? 6 : 12);
          G.p.mhp += v;
          G.p.hp = Math.min(G.p.mhp, G.p.hp + 20 + v)
        }
      } else if (c.kind === 'w') G.w[c.k] = c.lv;
      else if (c.kind === 'p') {
        G.ps[c.k] = c.lv;
        if (c.k === 'heart') {
          G.p.mhp += 20;
          G.p.hp = Math.min(G.p.mhp, G.p.hp + 30)
        }
      } else if (c.kind === 'm') {
        if (c.k === 'dash') {
          G.dashLv = c.lv;
          banner('DASH LV ' + G.dashLv + '!', '#c9a0ff')
        } else {
          G.wallLv = c.lv;
          banner('WALLS LV ' + G.wallLv + '!', '#c9a0ff')
        }
      } else if (c.kind === 'e') {
        if (c.k === 'walls') {
          G.wallEvo = 1;
          banner('EVOLVED: RADIANT WALLS!', '#9fd3ff')
        } else {
          G.evo[c.k] = 1;
          banner('EVOLVED: ' + WP[c.k].e + '!', '#ffd23f')
        }
        shake = 8
      } else if (c.k === 'gold') G.gold += 25;
      else G.p.hp = Math.min(G.p.mhp, G.p.hp + G.p.mhp * .3);
      sfx.pick();
      vib(15);
      ringFx(G.p.x, G.p.y, '#ffd23f', 80);
      fx(G.p.x, G.p.y, 20, '#ffd23f', 140);
      G.choice = null;
      if (G.queue > 0) {
        G.queue--;
        setTimeout(() => {
          if (G && !G.choice && !G.over) openChoice('lvl')
        }, 150)
      }
      if (G.tut && G.tut.step < 3) G.tut.step = 3
    }

        c: '#7a5acd',

    // ===== damage =====
    function hurtEnemy(e, dmg, kb = 0, ax = 0, ay = 0) {
      if (e.dead) return;
      let crit = Math.random() < SC.crit;
      dmg *= SC.dmg * (crit ? 2 : 1) * rnd(.9, 1.1);
      e.hp -= dmg;
      e.flash = .1;
      G.dmgDealt = (G.dmgDealt || 0) + dmg;
      if (kb && !e.boss) {
        const l = Math.hypot(ax, ay) || 1;
        e.kx += ax / l * kb;
        e.ky += ay / l * kb
      }
      dnum(e.x, e.y - e.r, dmg, crit);
      sfx.hit();
      if (e.hp <= 0) killEnemy(e)
    }

    function killEnemy(e) {
      e.dead = 1;
      G.kills++;
      sfx.kill();
      fx(e.x, e.y, e.boss ? 60 : e.elite ? 20 : 7, e.boss ? '#ffd23f' : ETYPE[e.type] ? ETYPE[e.type].c : '#fff', e.boss ? 200 : 80, .5, e.boss ? 6 : 3);

      });

        x: e.x + 5,
        y: e.y,
        v: 20,

      });

    function endRun(win) {
      if (G.over) return;
      const gold = Math.round(G.gold + G.kills / 30 + (win ? 220 * (1 + G.curse * .5) : 0) + (G.bb >= 3 && !win ? 60 : 0));
      G.over = {
        win,
        gold,
        t: 0
      };
      S.gold += gold;
      S.kills += G.kills;
      S.best = Math.max(S.best, Math.floor(G.t));
      if (win) {
        S.wins++;
        S.winsBy[S.char] = (S.winsBy[S.char] || 0) + 1;
        if (S.curse >= S.maxCurse && S.maxCurse < 5) {
          S.maxCurse = S.curse + 1;
          G.over.newCurse = S.maxCurse
        }
        sfx.win();
        vib([50, 50, 50, 50, 200])
      } else {
        sfx.die();
        vib([100, 50, 200])
      }
      S.tut = true;
      save()
    }
    // ===== weapons =====
    function fireWeapons(dt) {
      const p = G.p,
        w = G.w,
        ev = G.evo;
      for (const k in G.cd) G.cd[k] -= dt;
      if (w.bolt && !(G.cd.bolt > 0)) {
        const l = w.bolt,
          n = ev.bolt ? 5 : [1, 1, 2, 2, 3][l - 1],
          dmg = (ev.bolt ? 24 : 10 + 4 * l);
        G.cd.bolt = (ev.bolt ? .4 : [.8, .75, .7, .6, .55][l - 1]) * SC.cd;
        const t = nearest(p.x, p.y, 150 * SC.area);
        if (t) {
          sfx.shoot();
          const a0 = Math.atan2(t.y - p.y, t.x - p.x);
          for (let i = 0; i < n; i++) {
            const a = a0 + (i - (n - 1) / 2) * .16;
            G.pr.push({
              t: 'bolt',
              x: p.x,
              y: p.y,
              vx: Math.cos(a) * 300,
              vy: Math.sin(a) * 300,
              dmg,
              r: 5 * SC.area,
              l: 1.2,
              pierce: ev.bolt ? 4 : (l >= 5 ? 2 : 1),
              hit: new Set()
            })
          }
        }
      }
      if (w.orb) {
        const l = w.orb,
          n = ev.orb ? 8 : [1, 2, 2, 3, 5][l - 1],
          R = (ev.orb ? 75 : 48) * SC.area,
          dmg = ev.orb ? 20 : 6 + 3 * l;
        G.orbA += dt * (ev.orb ? 4 : 3);
        for (let i = 0; i < n; i++) {
          const a = G.orbA + i * 6.283 / n,
            ox = p.x + Math.cos(a) * R,
            oy = p.y + Math.sin(a) * R;
          for (const e of G.en) {
            if (e.dead) continue;
            if ((e.x - ox) ** 2 + (e.y - oy) ** 2 < (e.r + 8 * SC.area) ** 2 && !(e.hitT.orb > G.t)) {
              e.hitT.orb = G.t + .4;
              hurtEnemy(e, dmg, 40, e.x - p.x, e.y - p.y)
            }
          }
        }
      }
      if (w.rain && !(G.cd.rain > 0)) {
        const l = w.rain,
          n = ev.rain ? 5 : [1, 1, 2, 2, 3][l - 1];
        G.cd.rain = (ev.rain ? 2 : 3) * SC.cd;
        for (let i = 0; i < n; i++) {
          const t = G.en.length ? G.en[Math.random() * G.en.length | 0] : null;
          const tx = t && d2(t, p) < 250 * 250 ? t.x : p.x + rnd(-100, 100),
            ty = t && d2(t, p) < 250 * 250 ? t.y : p.y + rnd(-100, 100);
          G.pools.push({
            x: tx,
            y: ty,
            r: (ev.rain ? 46 : 26 + 3 * l) * SC.area,
            l: ev.rain ? 3.5 : 2.6,
            dmg: ev.rain ? 16 : 5 + 2 * l,
            tick: 0,
            slow: ev.rain
          })
        }
        tone(500, .15, 'triangle', .03, -200)
      }
      if (w.aura) {
        const l = w.aura,
          R = (ev.aura ? 95 : [38, 44, 52, 58, 68][l - 1]) * SC.area,
          dmg = ev.aura ? 16 : [4, 5, 7, 8, 10][l - 1];
        G.auraR = R;
        G.auraT -= dt;
        if (G.auraT <= 0) {
          G.auraT = .5;
          for (const e of G.en)
            if (!e.dead && d2(e, p) < (R + e.r) ** 2) hurtEnemy(e, dmg, l >= 5 || ev.aura ? 50 : 15, e.x - p.x, e.y - p.y);
          if (ev.aura) p.hp = Math.min(p.mhp, p.hp + .6)
        }
      } else G.auraR = 0;
      if (w.boom && !(G.cd.boom > 0)) {
        const l = w.boom,
          n = ev.boom ? 6 : [1, 1, 2, 2, 3][l - 1],
          dmg = ev.boom ? 26 : 10 + 4 * l;
        G.cd.boom = (ev.boom ? 1.1 : 1.6) * SC.cd;
        const t = nearest(p.x, p.y, 150 * SC.area),
          a0 = t ? Math.atan2(t.y - p.y, t.x - p.x) : Math.random() * 6.28;
        for (let i = 0; i < n; i++) {
          const a = a0 + i * 6.283 / n * (n > 1 ? 1 : 0);
          G.pr.push({
            t: 'boom',
            x: p.x,
            y: p.y,
            a,
            vx: Math.cos(a) * 240,
            vy: Math.sin(a) * 240,
            dmg,
            r: 9 * SC.area,
            l: ev.boom ? 2.2 : 1.6,
            age: 0,
            pierce: 999,
            hit: new Set(),
            rehit: .35
          })
        }
        tone(400, .2, 'triangle', .03, 300)
      }
      if (w.zap && !(G.cd.zap > 0)) {
        const l = w.zap,
          n = ev.zap ? 10 : [2, 3, 3, 4, 6][l - 1],
          dmg = ev.zap ? 40 : 14 + 5 * l;
        G.cd.zap = (ev.zap ? 1.2 : 2.2) * SC.cd;
        const vis = G.en.filter(e => Math.abs(e.x - p.x) < W / Z / 2 && Math.abs(e.y - p.y) < H / Z / 2);
        for (let i = 0; i < n && vis.length; i++) {
          const e = vis.splice(Math.random() * vis.length | 0, 1)[0];
          G.bolts.push({
            x: e.x,
            y: e.y,
            l: .25
          });
          hurtEnemy(e, dmg);
          if (ev.zap)
            for (const o of G.en)
              if (!o.dead && o !== e && d2(o, e) < 40 * 40) hurtEnemy(o, dmg * .5)
        }
        if (n) sfx.zap()
      }
    }
    // ===== update =====
    function update(dt) {
      clock += dt;
      if (trans) {
        trans.t += dt;
        if (trans.t >= .22 && !trans.done) {
          trans.done = 1;
          scene = trans.to;
          if (trans.fn) trans.fn()
        }
        if (trans.t >= .44) trans = null
      }
      if (toast) {
        toast.l -= dt;
        if (toast.l <= 0) toast = null
      }
      if (pressed) {
        pressed.t -= dt;
        if (pressed.t <= 0) pressed = null
      }
      shake = Math.max(0, shake - dt * 30);
      for (const q of uiParts) {
        q.x += q.vx * dt;
        q.y += q.vy * dt;
        q.vy += 200 * dt;
        q.l -= dt
      }
      uiParts = uiParts.filter(q => q.l > 0);
      if (scene !== 'play' || !G) return;
      if (G.over) {
        G.over.t += dt;
        if (!window.simOverSent) {
          window.simOverSent = true;
          sendGameState();
        }
        return
      }
      if (G.paused || G.choice) {
        if (G.choice) {
          G.choice.t += dt;
          // Simulator auto-select
          if (window.simAutoPlay && G.choice.t > 0.35) {
            const cards = G.choice.cards;
            if (cards && cards.length > 0) {
              const idx = simPickCardIndex(cards);
              const c = cards[idx];
              cards.splice(idx, 1);
              choose(c);
            }
          }
        }
        return
      }
      if (G.revHold) {
        G.revHold.t += dt;
        if (G.revHold.t >= G.revHold.l) G.revHold = null;
        return
      }
      // Death cinematic
      if (G.deathCinematic) {
        G.deathCinematic.t += dt;
        const dc = G.deathCinematic;
        dc.tipAngle = Math.min(Math.PI / 2, dc.t / dc.duration * Math.PI / 2);
        if (dc.t >= dc.duration) {
          G.deathCinematic = null;
          endRun(false);
          return;
        }
        // Slow motion effect
        dt = dt * 0.15;
      }
      SC = st();
      const g = G,
        p = g.p;
      g.t += dt;
      if (g.banner) {
        g.banner.l -= dt;
        if (g.banner.l <= 0) g.banner = null
      }
      g.flash = Math.max(0, g.flash - dt * 2);
      if (g.tut) {
        g.tut.t += dt;
        if (g.tut.step === 0 && (joy.on || mt.on || g.auto) && g.tut.t > .5) {
          g.tut.step = 1;
          g.tut.t = 0
        }
        if (g.tut.step === 1 && g.tut.t > 4) {
          g.tut.step = 2;
          g.tut.t = 0
        }
        if (g.tut.step === 3 && g.tut.t > 0) g.tut.step = 4, g.tut.t = 0;
        if (g.tut.step === 4 && g.tut.t > 4) {
          g.tut = null;
          S.tut = true;
          save()
        }
      }
      // move
      let mx = 0,
        my = 0;
      if (joy.on) {
        const dx = joy.x - joy.ox,
          dy = joy.y - joy.oy,
          l = Math.hypot(dx, dy);
        if (l > 4 * U) {
          let k;
          if (md('speed')) {
            k = Math.min(1, Math.max(0, (l - 4 * U) / (56 * U)));
            if (S.mods.speedCurve) k = Math.sqrt(k)
          } else k = Math.min(1, l / (40 * U));
          mx = dx / l * k;
          my = dy / l * k
        }
        if (l > 60 * U) {
          joy.ox = joy.x - dx / l * 60 * U;
          joy.oy = joy.y - dy / l * 60 * U
        }
      }
      if (mt.on && !(keys.a || keys.d || keys.w || keys.s || keys.arrowleft || keys.arrowright || keys.arrowup || keys.arrowdown)) {
        const dx = mt.wx - p.x,
          dy = mt.wy - p.y,
          l = Math.hypot(dx, dy);
        if (l > 7 / Z) {
          const k = Math.min(1, l / Math.max(1e-6, SC.spd * dt));
          mx = dx / l * k;
          my = dy / l * k
        }
      }
      if (keys.a || keys.arrowleft) mx = -1;
      if (keys.d || keys.arrowright) mx = 1;
      if (keys.w || keys.arrowup) my = -1;
      if (keys.s || keys.arrowdown) my = 1;
      if (g.auto) {
        const v = autopilot();
        mx = v[0];
        my = v[1]
      }
      // Simulator AI for dash/wall
      if (window.simAutoPlay && G.dashLv > 0 && md('dash') && g.dashCd <= 0) {
        // Dash when surrounded by enemies
        let nearbyEnemies = 0;
        for (const e of g.en) {
          if (!e.dead && d2(e, p) < 120 * 120) nearbyEnemies++;
        }
        if (nearbyEnemies >= 3) dashNow();
      }
      if (window.simAutoPlay && G.wallLv > 0 && md('walls') && !g.wallDraw) {
        // Start wall trail periodically
        if (!window.simWallTimer) window.simWallTimer = 0;
        window.simWallTimer += dt;
        if (window.simWallTimer >= 8) {
          window.simWallTimer = 0;
          placeWall();
        }
      }
      if (g.dashV) {
        p.x += g.dashV.vx * dt;
        p.y += g.dashV.vy * dt;
        if (Math.random() < .9) fx(p.x - p.mdx * 8, p.y - p.mdy * 8, 1, '#c9a0ff', 25, .22, 3);
        g.dashV.t -= dt;
        if (g.dashV.t <= 0) g.dashV = null;
      } else {
        p.x += mx * SC.spd * dt;
        p.y += my * SC.spd * dt
      }
      if (mx || my) {
        p.mdx = mx;
        p.mdy = my
      }
      if (mx) p.face = mx > 0 ? 1 : -1;
      p.walk += Math.hypot(mx, my) * dt * 12;
      p.inv = Math.max(0, p.inv - dt);
      p.moving = Math.hypot(mx, my) > .1;
      
      // Simulator telemetry
      if (window.simTotalPixels !== undefined) {
        const dx = p.x - window.simLastPos.x;
        const dy = p.y - window.simLastPos.y;
        const dist = Math.hypot(dx, dy);
        window.simTotalPixels += dist;
        window.simMaxTravel = Math.max(window.simMaxTravel, Math.hypot(p.x, p.y));
        const speed = dist / dt;
        window.simMaxSpeed = Math.max(window.simMaxSpeed, speed);
        if (dist < 0.5) {
          window.simFramesStationary++;
          window.simLastStationary += dt;
          window.simMaxLinger = Math.max(window.simMaxLinger, window.simLastStationary);
        } else {
          window.simLastStationary = 0;
        }
        window.simLastPos = { x: p.x, y: p.y };
        
        // Send telemetry periodically
        if (!window.simTelemetryTimer) window.simTelemetryTimer = 0;
        if (!window.simTelemetryWall) window.simTelemetryWall = 0;
        window.simTelemetryTimer += dt;
        const teleWall = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        if (window.simTelemetryTimer >= 0.5 && teleWall - window.simTelemetryWall >= 500) {
          window.simTelemetryTimer = 0;
          window.simTelemetryWall = teleWall;
          sendTelemetry();
        }
      }
      
      // spawn
      if (!g.won) {
        const bt = BOSS[g.bossI];
        if (bt && g.t >= bt.t && !g.boss) {
          spawnBoss(g.bossI);
          g.bossI++
        }
        const rate = Math.min(12, .9 + g.t / 28 + Math.pow(g.t / 150, 2)) * (g.boss ? .55 : 1) * (1 + .2 * g.curse);
        g.spawnAcc += rate * dt;
        const pool = ['blob', 'blob'];
        if (g.t > 25) pool.push('bat', 'bat');
        if (g.t > 80) pool.push('skel');
        if (g.t > 140) pool.push('ghost', 'bat');
        if (g.t > 200) pool.push('imp');
        if (g.t > 300) pool.push('skel', 'imp');
        if (g.phase === 3) {
          pool.length = 0;
          pool.push('vine', 'vine', 'frog', 'skel', 'bat', 'imp')
        } else if (g.phase >= 4) {
          pool.length = 0;
          pool.push('wisp', 'wisp', 'harpy', 'ghost', 'bat', 'frog')
        }
        while (g.spawnAcc >= 1 && g.en.length < 320) {
          g.spawnAcc--;
          if (pool.includes('bat') && Math.random() < .04) {
            const t = pool[Math.random() * pool.length | 0];
            for (let i = 0; i < 6; i++) spawnEnemy(t)
          } else spawnEnemy(pool[Math.random() * pool.length | 0])
        }
        g.eliteT -= dt;
        if (g.eliteT <= 0) {
          g.eliteT = 42;
          spawnEnemy(pool[Math.random() * pool.length | 0], true);
          banner('ELITE INCOMING!', '#ff8a3d')
        }
      }
      fireWeapons(dt);
      // projectiles
      for (const b of g.pr) {
        b.l -= dt;
        if (b.t === 'boom') {
          b.age += dt;
          const back = b.age > b.l * .45;
          if (back) {
            const dx = p.x - b.x,
              dy = p.y - b.y,
              l = Math.hypot(dx, dy) || 1;
            b.vx += (dx / l * 600 - b.vx) * dt * 4;
            b.vy += (dy / l * 600 - b.vy) * dt * 4;
            if (l < 10 && b.age > .4) b.l = 0
          }
        }
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        for (const e of g.en) {
          if (e.dead || b.l <= 0) continue;
          if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < (e.r + b.r) ** 2) {
            if (b.t === 'boom') {
              if (e.hitT['b' + b.a] > g.t) continue;
              e.hitT['b' + b.a] = g.t + b.rehit
            } else {
              if (b.hit.has(e)) continue;
              b.hit.add(e)
            }
            hurtEnemy(e, b.dmg, b.t === 'bolt' ? 25 : 35, b.vx, b.vy);
            if (b.t === 'bolt') {
              fx(b.x, b.y, 3, '#fff3c4', 50, .25);
              if (--b.pierce <= 0) b.l = 0
            }
          }
        }
      }
      g.pr = g.pr.filter(b => b.l > 0);
      for (const q of g.pools) {
        q.l -= dt;
        q.tick -= dt;
        if (q.tick <= 0) {
          q.tick = .4;
          for (const e of g.en)
            if (!e.dead && d2(e, q) < (q.r + e.r) ** 2) {
              hurtEnemy(e, q.dmg);
              if (q.slow) e.slowT = .5
            }
        }
      }
      g.pools = g.pools.filter(q => q.l > 0);
      for (const b of g.bolts) b.l -= dt;
      g.bolts = g.bolts.filter(b => b.l > 0);
      updWalls(dt);
      g.wallCd = Math.max(0, g.wallCd - dt);
      if (g.dashCd > 0) g.dashCd = Math.max(0, g.dashCd - dt);
      zoomT += ((g.dashV ? 1 : 0) - zoomT) * Math.min(1, dt * (g.dashV ? 24 : 10));
      // enemies
      const grid = new Map(),
        CS = 24;
      for (const e of g.en) {
        const k = ((e.x / CS) | 0) * 7919 + ((e.y / CS) | 0);
        let a = grid.get(k);
        if (!a) grid.set(k, a = []);
        a.push(e)
      }
      for (const e of g.en) {
        if (e.dead) continue;
        e.flash = Math.max(0, e.flash - dt);
        e.ph += dt;
        let dx = p.x - e.x,
          dy = p.y - e.y;
        const l = Math.hypot(dx, dy) || 1;
        let sp = e.spd * (e.slowT > 0 ? .5 : 1);
        e.slowT = (e.slowT || 0) - dt;
        if (e.type === 'imp' && l < 150) {
          sp *= -.3;
          e.shootT -= dt;
          if (e.shootT <= 0) {
            e.shootT = rnd(2.5, 4);
            g.eb.push({
              x: e.x,
              y: e.y,
              vx: dx / l * 110,
              vy: dy / l * 110,
              r: 5,
              dmg: e.dmg,
              l: 4
            })
          }
        }
        if (e.type === 'bat') sp *= 1 + .3 * Math.sin(e.ph * 5);
        if (e.type === 'vine') {
          const s3 = Math.sin(e.ph * 6) * .9;
          const ox = -dy / l * s3,
            oy = dx / l * s3;
          e.x += ox * sp * dt;
          e.y += oy * sp * dt
        }
        if (e.type === 'frog') {
          const cyc = e.ph % 1.6;
          if (cyc < 1.1) sp = 0;
          else sp *= 7
        }
        if (e.type === 'wisp') {
          const a = Math.atan2(dy, dx) + (l < 120 ? 1.3 : .5);
          e.x += Math.cos(a) * sp * dt - dx / l * sp * dt;
          e.y += Math.sin(a) * sp * dt - dy / l * sp * dt
        }
        if (e.type === 'harpy' && l < 190) {
          sp *= -.2;
          e.shootT = (e.shootT || rnd(1, 3)) - dt;
          if (e.shootT <= 0) {
            e.shootT = rnd(3, 4.5);
            const a0 = Math.atan2(dy, dx);
            for (let i = -1; i <= 1; i++) g.eb.push({
              x: e.x,
              y: e.y,
              vx: Math.cos(a0 + i * .3) * 120,
              vy: Math.sin(a0 + i * .3) * 120,
              r: 4,
              dmg: e.dmg,
              l: 3,
              c: '#eaf4ff'
            })
          }
        }
        if (e.boss) bossAI(e, dx, dy, l, dt);
        else {
          e.x += dx / l * sp * dt;
          e.y += dy / l * sp * dt
        }
        e.x += e.kx * dt;
        e.y += e.ky * dt;
        e.kx *= Math.pow(.02, dt);
        e.ky *= Math.pow(.02, dt);
        if (g.walls && g.walls.length)
          for (const w of g.walls) {
            if (PHASERS.has(e.type)) continue;
            if (!w.laser && FW.has(e.type)) continue;
            const dseg = segD2(e.x, e.y, w.x1, w.y1, w.x2, w.y2),
              R = e.r + w.th / 2;
            if (dseg < R * R) {
              if (e.boss) {
                w.hp -= e.dmg * 16 * dt;
                continue
              }
              const vx2 = w.x2 - w.x1,
                vy2 = w.y2 - w.y1,
                L2 = vx2 * vx2 + vy2 * vy2 || 1;
              let t2 = ((e.x - w.x1) * vx2 + (e.y - w.y1) * vy2) / L2;
              t2 = Math.max(0, Math.min(1, t2));
              const qx = w.x1 + vx2 * t2,
                qy = w.y1 + vy2 * t2;
              let ex = e.x - qx,
                ey = e.y - qy,
                d = Math.hypot(ex, ey) || .01;
              const push = e.r + w.th / 2 - d + .5;
              e.x += ex / d * push;
              e.y += ey / d * push
            } else if (dseg < (R + 6) * (R + 6)) w.hp -= e.dmg * 1.2 * dt * (e.elite ? 1.6 : 1)
          }
        if (!e.boss && e.type !== 'ghost') {
          const cx = (e.x / CS) | 0,
            cy = (e.y / CS) | 0;
          for (let i = -1; i <= 1; i++)
            for (let j = -1; j <= 1; j++) {
              const a = grid.get((cx + i) * 7919 + cy + j);
              if (a)
                for (const o of a) {
                  if (o === e) continue;
                  const ox = e.x - o.x,
                    oy = e.y - o.y,
                    dd = ox * ox + oy * oy,
                    rr2 = (e.r + o.r) * .9;
                  if (dd < rr2 * rr2 && dd > .01) {
                    const d = Math.sqrt(dd),
                      push = (rr2 - d) * .5;
                    e.x += ox / d * push;
                    e.y += oy / d * push
                  }
                }
            }
        }
        if (l < e.r + 8) hurtPlayer(e.dmg);
        if (!e.boss && (Math.abs(e.x - p.x) > W / Z / 2 + 140 || Math.abs(e.y - p.y) > H / Z / 2 + 140)) {
          const ep = edgePt(18);
          e.x = ep[0];
          e.y = ep[1]
        }
      }
      g.en = g.en.filter(e => !e.dead);
      const nb = [];
      for (const b of g.eb) {
        b.l -= dt;
        if (b.orb) {
          b.ang += b.dang * dt;
          b.rad = Math.max(0, b.rad - b.drad * dt);
          b.x = b.ox + Math.cos(b.ang) * b.rad;
          b.y = b.oy + Math.sin(b.ang) * b.rad;
          if (b.rad <= 12) b.l = 0
        } else {
          if (b.tw) {
            const c = Math.cos(b.tw * dt),
              s2 = Math.sin(b.tw * dt),
              vx = b.vx;
            b.vx = vx * c - b.vy * s2;
            b.vy = vx * s2 + b.vy * c
          }
          b.x += b.vx * dt;
          b.y += b.vy * dt
        }
        if (b.split !== undefined) {
          b.split -= dt;
          if (b.split <= 0) {
            b.l = 0;
            fx(b.x, b.y, 6, '#7dff6a', 60);
            for (let i = 0; i < 5; i++) {
              const a = i * 6.283 / 5 + Math.random();
              nb.push({
                x: b.x,
                y: b.y,
                vx: Math.cos(a) * 130,
                vy: Math.sin(a) * 130,
                r: 4,
                dmg: b.dmg * .7,
                l: 2.5,
                c: '#b8ff6a'
              })
            }
          }
        }
        if (b.l > 0 && d2(b, p) < (b.r + 7) ** 2) {
          hurtPlayer(b.dmg);
          b.l = 0
        }
      }
      g.eb = g.eb.filter(b => b.l > 0).concat(nb);
      updTele(dt);
      // gems
      g.gemT -= dt;
      if (g.gemT <= 0) g.gemChain = 0;
      const mg = SC.mag;
      for (const q of g.gems) {
        const dd = d2(q, p);
        if (q.vac || dd < mg * mg) {
          const l = Math.sqrt(dd) || 1,
            s = q.vac ? 520 : 300;
          q.x += (p.x - q.x) / l * s * dt;
          q.y += (p.y - q.y) / l * s * dt;
          if (dd < 14 * 14) {
            q.got = 1;
            if (q.k === 'gold') {
              g.gold += q.v;
              sfx.gold();
              dnum(p.x, p.y - 24, q.v, 'g')
            } else if (q.k === 'heart') {
              p.hp = Math.min(p.mhp, p.hp + q.v);
              tone(880, .2, 'triangle', .06, 400)
            } else if (q.k === 'chest') {
              chest()
            } else if (q.k === 'magnet') {
              g.gems.forEach(o => {
                if (o.k !== 'chest') o.vac = 1
              })
            } else {
              g.gemChain++;
              g.gemT = .4;
              sfx.gem(g.gemChain);
              g.xp += q.v * SC.xpm;
              if (g.tut && g.tut.step === 2) g.tut.step = 2.5;
              while (g.xp >= need(g.lvl)) {
                g.xp -= need(g.lvl);
                g.lvl++;
                g.queue++
              }
            }
          }
        }
      }
      g.gems = g.gems.filter(q => !q.got);
      if (g.gems.length > 450) {
        const old = g.gems.splice(0, 100).filter(q => q.k === 'xp' || q.k === 'mid');
        let s = old.reduce((a, q) => a + q.v, 0);
        if (s) g.gems.push({
          x: p.x + rnd(-150, 150),
          y: p.y + rnd(-150, 150),
          v: s,
          k: 'big'
        })
      }
      if (Math.random() < dt / 40) g.gems.push({
        x: p.x + rnd(-180, 180),
        y: p.y + rnd(-260, 260),
        v: 0,
        k: 'magnet'
      });
      if (g.queue > 0 && !g.choice) {
        g.queue--;
        openChoice('lvl')
      }
      for (const f of g.fx) {
        if (f.ring) {
          f.r += (f.R - f.r) * dt * 10;
          f.l -= dt;
          continue
        }
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.vx *= .92;
        f.vy *= .92;
        f.l -= dt
      }
      g.fx = g.fx.filter(f => f.l > 0);
      if (g.fx.length > 500) g.fx.splice(0, 100);
      for (const n of g.dn) {
        n.y -= 30 * dt;
        n.l -= dt
      }
      g.dn = g.dn.filter(n => n.l > 0)
    }
    const need = l => Math.round(4 + l * 3.2 + Math.max(0, l - 12) * 3 + Math.max(0, l - 25) * 6);
    // ===== mods: dash & walls =====
    const FW = new Set(['bat', 'harpy']),
      PHASERS = new Set(['ghost', 'wisp']);
    const dashDesc = l => ['', '+1 dash! Ready to use now.', 'Longer dash distance', 'Faster dash', 'Shorter cooldown', 'MAX speed blast'][Math.min(5, l)] || '';
    const wallDesc = l => ['', 'Wall trail! Tap ▬/E to draw', 'Longer wall duration', 'Tougher walls (+HP)', 'Longer wall trail', 'Big walls, ready to evolve'][Math.min(5, l)] || '';

    function dashNow() {
      const g = G,
        p = g.p;
      if (!g || scene !== 'play' || g.over || g.choice || g.paused || !md('dash') || g.dashV || g.dashCd > 0) return;
      const lv = g.dashLv,
        dirx = p.mdx || p.face,
        diry = p.mdy || 0,
        l = Math.hypot(dirx, diry) || 1;
      g.dashV = {
        vx: dirx / l * (600 + 60 * lv),
        vy: diry / l * (600 + 60 * lv),
        t: .13 + .015 * lv
      };
      g.dashCd = g.dashCdM = Math.max(1.2, 4 - .45 * lv);
      p.inv = Math.max(p.inv, g.dashV.t + .1);
      ringFx(p.x, p.y, '#c9a0ff', 40);
      noise(.08, .1);
      tone(500, .18, 'triangle', .06, 240);
      vib(18)
    }
    const WG = 24;

    function wallCap() {
      // 2× max walls for the new mod (tap Shift=dash, hold Shift=wall draw)
      return ([3, 4, 5, 6, 7][Math.max(1, G.wallLv) - 1] + (G.wallEvo ? 2 : 0)) * 2;
    }

    function placeWall() {
      const g = G,
        p = g.p;
      if (!g || scene !== 'play' || g.over || g.choice || g.paused || !md('walls')) return;
      const mx = wallCap(),
        n = g.walls.filter(w => w.l > 0).length;
      if (!g.wallDraw && n >= mx) {
        g.banner = {
          t: 'MAX WALLS: ' + mx,
          c: '#c9a0ff',
          l: 1
        };
        tone(120, .15, 'square', .05, -40);
        return;
      }
      g.wallDraw = g.wallDraw ? 0 : 1;
      if (g.wallDraw) {
        g.wallCell = {
          cx: Math.floor(p.x / WG),
          cy: Math.floor(p.y / WG)
        };
        banner('WALL TRAIL: DRAW', '#9fd3ff');
        tone(g.wallEvo ? 1100 : 340, .08, g.wallEvo ? 'sawtooth' : 'square', .04);
        vib(8)
      } else {
        g.wallCell = null;
        banner('WALL TRAIL: STOP', '#a8875a');
        tone(160, .07, 'square', .03, -40);
        vib(4)
      }
    }

    function emitWallSeg(g, a, b) {
      const x1 = (a.cx + .5) * WG,
        y1 = (a.cy + .5) * WG,
        x2 = (b.cx + .5) * WG,
        y2 = (b.cy + .5) * WG,
        lv = g.wallLv;
      const mx = wallCap();
      const n = g.walls.filter(w => w.l > 0).length;
      if (n >= mx) {
        g.wallDraw = 0;
        g.wallCell = null;
        g.banner = {
          t: 'MAX WALLS: ' + mx,
          c: '#c9a0ff',
          l: 1
        };
        tone(120, .15, 'square', .05, -40);
        return false;
      }
      const hp = g.wallEvo ? 440 : (16 + 12 * lv) * 2;
      g.walls.push({
        x1,
        y1,
        x2,
        y2,
        th: (g.wallEvo ? 14 : 10) + 1.0 * lv,
        hp,
        mhp: hp,
        l: g.wallEvo ? 7.5 : 2.6 + lv * 0.7,
        tick: 0,
        laser: !!g.wallEvo
      });
      if (g.t - (g.wallSndT || 0) > .2) {
        g.wallSndT = g.t;
        noise(.04, .04);
        tone(g.wallEvo ? 1300 : 230, .05, g.wallEvo ? 'sawtooth' : 'square', .022)
      }
      fx(x2, y2, 2, g.wallEvo ? '#9fd3ff' : '#c9a06a', 30, .35, 2);
      return true
    }

    function updWalls(dt) {
      const g = G;
      if (!g.walls) return;
      if (g.wallDraw && g.wallLv > 0 && md('walls')) {
        const p = g.p,
          c = {
            cx: Math.floor(p.x / WG),
            cy: Math.floor(p.y / WG)
          };
        if (!g.wallCell) g.wallCell = {
          cx: c.cx,
          cy: c.cy
        };
        else {
          let a = g.wallCell,
            guard = 0;
          while ((a.cx !== c.cx || a.cy !== c.cy) && guard++ < 6) {
            const dx = c.cx - a.cx,
              dy = c.cy - a.cy;
            let n;
            if (dx !== 0 && Math.abs(dx) >= Math.abs(dy)) n = {
              cx: a.cx + Math.sign(dx),
              cy: a.cy
            };
            else if (dy !== 0) n = {
              cx: a.cx,
              cy: a.cy + Math.sign(dy)
            };
            else break;
            if (!emitWallSeg(g, a, n)) {
              break;
            }
            a = n
          }
          g.wallCell = {
            cx: a.cx,
            cy: a.cy
          }
        }
      }
      for (const w of g.walls) {
        w.l -= dt;
        if (w.l <= 0) continue;
        if (w.laser) {
          w.tick -= dt;
          if (w.tick <= 0) {
            w.tick = .4;
            for (const e of g.en) {
              if (e.dead || PHASERS.has(e.type)) continue;
              const dmg = (e.boss ? 6 : 26 + 8 * g.wallLv) * .4;
              hurtEnemy(e, dmg);
              fx(e.x, e.y, 2, '#9fd3ff', 60, .3, 2)
            }
          }
        }
      }
      g.walls = g.walls.filter(w => {
        if (w.l > 0 && w.hp > 0) return true;
        fx((w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2, 10, w.laser ? '#9fd3ff' : '#a8875a', 80, .6, 3);
        tone(90, .15, 'square', .04, -30);
        return false
      })
    }

    function chest() {
      const g = G;
      const n = Math.random() < .2 ? 3 : Math.random() < .4 ? 2 : 1;
      g.gold += Math.round(20 * SC.greed);
      banner('TREASURE CHEST! x' + n, '#ffd23f');
      sfx.buy();
      vib([20, 20, 20, 20, 60]);
      shake = 6;
      g.queue += n - 1;
      openChoice('chest')
    }

    function bossAI(e, dx, dy, l, dt) {
      const g = G;
      e.atk -= dt;
      const B = BOSS[e.bi];
      if (e.bi === 3) return thornAI(e, dx, dy, l, dt);
      if (e.bi === 4) return stormAI(e, dx, dy, l, dt);
      if (e.dash > 0) {
        e.dash -= dt;
        e.x += e.dvx * dt;
        e.y += e.dvy * dt;
        return
      }
      const bo = G.t - BOSS[e.bi].t,
        enr = bo > 150 ? 3 : bo > 90 ? 1.8 : 1;
      e.x += dx / l * e.spd * enr * dt;
      e.y += dy / l * e.spd * enr * dt;
      if (e.atk <= 0) {
        if (e.bi === 0) {
          e.atk = 3;
          for (let i = 0; i < 4; i++) {
            const m = spawnEnemy('blob');
            m.x = e.x + rnd(-30, 30);
            m.y = e.y + rnd(-30, 30)
          }
          fx(e.x, e.y, 20, '#7d4a2a', 120);
          tone(150, .3, 'square', .08, -60)
        } else if (e.bi === 1) {
          e.atk = 2.6;
          e.dash = .6;
          e.dvx = dx / l * 280;
          e.dvy = dy / l * 280;
          tone(600, .4, 'sawtooth', .06, -400);
          for (let i = 0; i < 4; i++) {
            const m = spawnEnemy('bat');
            m.x = e.x;
            m.y = e.y
          }
        } else {
          e.atk = 2.2;
          const n = 14,
            o = Math.random();
          for (let i = 0; i < n; i++) {
            const a = o + i * 6.283 / n;
            g.eb.push({
              x: e.x,
              y: e.y,
              vx: Math.cos(a) * 95,
              vy: Math.sin(a) * 95,
              r: 6,
              dmg: 12,
              l: 5
            })
          }
          shake = 6;
          tone(120, .4, 'sawtooth', .1, -50)
        }
      }
    }
    // ===== telegraphed hazards (bosses 4/5) =====
    // circle: {k:'c',x,y,r,T,t,dmg,c}   line: {k:'l',x,y,x2,y2,w,T,t,dmg,c}
    function tele(o) {
      o.t = 0;
      (G.tele || (G.tele = [])).push(o);
      return o
    }

    function segD2(px, py, ax, ay, bx, by) {
      const vx = bx - ax,
        vy = by - ay,
        L = vx * vx + vy * vy || 1;
      let t = ((px - ax) * vx + (py - ay) * vy) / L;
      t = Math.max(0, Math.min(1, t));
      const qx = ax + vx * t - px,
        qy = ay + vy * t - py;
      return qx * qx + qy * qy
    }

    function updTele(dt) {
      const g = G,
        p = g.p;
      if (!g.tele) return;
      for (const q of g.tele) {
        q.t += dt;
        if (!q.fired && q.t >= q.T) {
          q.fired = 1;
          q.post = .25;
          const hit = q.k === 'c' ? d2(q, p) < (q.r + 6) ** 2 : segD2(p.x, p.y, q.x, q.y, q.x2, q.y2) < (q.w / 2 + 6) ** 2;
          if (hit) hurtPlayer(q.dmg);
          if (q.k === 'c') {
            fx(q.x, q.y, 10, q.c, 140, .4, 3);
            ringFx(q.x, q.y, q.c, q.r)
          } else {
            for (let i = 0; i < 6; i++) {
              const f = i / 5;
              fx(q.x + (q.x2 - q.x) * f, q.y + (q.y2 - q.y) * f, 2, q.c, 80, .3, 3)
            }
          }
          if (q.snd && lim('tele', 90)) q.snd()
        }
        if (q.fired) q.post -= dt
      }
      g.tele = g.tele.filter(q => !q.fired || q.post > 0)
    }

    function drawTele() {
      const g = G;
      if (!g.tele) return;
      for (const q of g.tele) {
        const k = Math.min(1, q.t / q.T);
        x.save();
        if (!q.fired) {
          const blink = k > .7 ? (.55 + .45 * Math.sin(clock * 40)) : 1;
          x.globalAlpha = (.3 + .3 * k) * blink;
          x.fillStyle = q.c;
          x.strokeStyle = q.c;
          if (q.k === 'c') {
            x.beginPath();
            x.arc(q.x, q.y, q.r, 0, 7);
            x.fill();
            x.globalAlpha = .9 * blink;
            x.lineWidth = 2;
            x.beginPath();
            x.arc(q.x, q.y, q.r, 0, 7);
            x.stroke();
            x.beginPath();
            x.arc(q.x, q.y, q.r * k, 0, 7);
            x.stroke()
          } else {
            x.lineCap = 'round';
            x.lineWidth = q.w * k;
            x.beginPath();
            x.moveTo(q.x, q.y);
            x.lineTo(q.x2, q.y2);
            x.stroke();
            x.globalAlpha = .95 * blink;
            x.lineWidth = 2.5;
            x.setLineDash([8, 6]);
            x.lineDashOffset = -clock * 60;
            x.beginPath();
            x.moveTo(q.x, q.y);
            x.lineTo(q.x2, q.y2);
            x.stroke();
            x.setLineDash([])
          }
        } else {
          x.globalAlpha = Math.max(0, q.post * 4);
          x.fillStyle = '#fff';
          x.strokeStyle = '#fff';
          if (q.k === 'c') {
            x.beginPath();
            x.arc(q.x, q.y, q.r, 0, 7);
            x.fill()
          } else {
            x.lineCap = 'round';
            x.lineWidth = q.w;
            x.beginPath();
            x.moveTo(q.x, q.y);
            x.lineTo(q.x2, q.y2);
            x.stroke();
            x.strokeStyle = q.c;
            x.lineWidth = q.w * .4;
            x.stroke()
          }
        }
        x.restore()
      }
    }

    function bossPhase(e, names, col) {
      const f = e.hp / e.mhp,
        ph = f > .66 ? 1 : f > .33 ? 2 : 3;
      if (ph !== e.bph) {
        const first = !e.bph;
        e.bph = ph;
        e.seq = 0;
        if (!first) {
          banner(names[ph - 2], col);
          shake = 12;
          vib([60, 40, 60]);
          sfx.boss();
          ringFx(e.x, e.y, col, 160);
          G.eb = G.eb.filter(b => !b.orb);
          e.atk = 1.4
        }
      }
      return ph
    }
    // THORN MOTHER — jungle. P1 roams: seed spirals + root snares. P2 roots in place: vine lashes + bursting pods. P3: everything faster, frogs.
    function thornAI(e, dx, dy, l, dt) {
      const g = G,
        p = g.p,
        ph = bossPhase(e, ['THORN MOTHER TAKES ROOT!', 'THORN MOTHER BLOOMS IN RAGE!'], '#7dff6a');
      if (e.burrow > 0) {
        e.burrow -= dt;
        if (e.burrow <= 0) {
          e.x = e.bx;
          e.y = e.by;
          for (let i = 0; i < 12; i++) {
            const a = i * .5236;
            g.eb.push({
              x: e.x,
              y: e.y,
              vx: Math.cos(a) * 100,
              vy: Math.sin(a) * 100,
              r: 5,
              dmg: 12,
              l: 3,
              c: '#9be86a'
            })
          }
          shake = 10;
          noise(.3, .15);
          fx(e.x, e.y, 24, '#5a3a1a', 160)
        }
        return
      }
      if (l > 270 && e.atk > .5) {
        const a = Math.random() * 6.283;
        e.bx = p.x + Math.cos(a) * 90;
        e.by = p.y + Math.sin(a) * 90;
        e.burrow = 1.1;
        tele({
          k: 'c',
          x: e.bx,
          y: e.by,
          r: 48,
          T: 1.1,
          dmg: 20,
          c: '#8a5a2a'
        });
        fx(e.x, e.y, 20, '#5a3a1a', 120);
        tone(110, .6, 'sawtooth', .06, -40);
        return
      }
      const sp = ph === 2 ? 0 : e.spd * (ph === 3 ? 1.35 : 1);
      e.x += dx / l * sp * dt;
      e.y += dy / l * sp * dt;
      if (e.spiral > 0) {
        e.spiral -= dt;
        e.sT = (e.sT || 0) - dt;
        if (e.sT <= 0) {
          e.sT = ph === 3 ? .07 : .09;
          e.sa = (e.sa || 0) + .32;
          const arms = ph === 3 ? 3 : 2;
          for (let i = 0; i < arms; i++) {
            const a = e.sa + i * 6.283 / arms;
            g.eb.push({
              x: e.x,
              y: e.y,
              vx: Math.cos(a) * 85,
              vy: Math.sin(a) * 85,
              r: 5,
              dmg: 12,
              l: 5,
              c: '#9be86a'
            })
          }
        }
      }
      if (e.atk > 0) return;
      const pats = ph === 1 ? ['spiral', 'snare'] : ph === 2 ? ['lash', 'pods', 'snare', 'lash'] : ['spiral', 'lash', 'snare', 'pods'];
      const k = pats[(e.seq++) % pats.length];
      e.atk = ph === 1 ? 2.8 : ph === 2 ? 2.3 : 1.7;
      if (k === 'spiral') {
        e.spiral = 1.8;
        tone(300, .5, 'triangle', .06, 300)
      } else if (k === 'snare') {
        const n = ph === 3 ? 7 : 5;
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.283,
            d = i ? rnd(40, 130) : 0;
          tele({
            k: 'c',
            x: p.x + Math.cos(a) * d + (i ? 0 : G.p.vx || 0),
            y: p.y + Math.sin(a) * d,
            r: 30,
            T: .95,
            dmg: 16,
            c: '#e85a9a',
            snd: () => noise(.15, .08)
          })
        }
        tone(180, .3, 'square', .05, -60);
        if (ph === 3)
          for (let i = 0; i < 3; i++) {
            const m = spawnEnemy('frog');
            m.x = e.x + rnd(-40, 40);
            m.y = e.y + rnd(-40, 40)
          }
      } else if (k === 'lash') {
        const n = ph === 3 ? 5 : 3,
          a0 = Math.atan2(dy, dx);
        for (let i = 0; i < n; i++) {
          const a = a0 + (i - (n - 1) / 2) * .38;
          tele({
            k: 'l',
            x: e.x,
            y: e.y,
            x2: e.x + Math.cos(a) * 560,
            y2: e.y + Math.sin(a) * 560,
            w: 22,
            T: .85,
            dmg: 18,
            c: '#7dff6a',
            snd: () => {
              noise(.2, .12);
              tone(90, .25, 'sawtooth', .08, -40)
            }
          })
        }
        tone(520, .6, 'sawtooth', .03, -300)
      } else if (k === 'pods') {
        const n = ph === 3 ? 8 : 6;
        for (let i = 0; i < n; i++) {
          const a = i * 6.283 / n + Math.random() * .3;
          g.eb.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(a) * 70,
            vy: Math.sin(a) * 70,
            r: 8,
            dmg: 14,
            l: 3,
            split: 1.3,
            c: '#5ac83a'
          })
        }
        tone(220, .3, 'triangle', .07, 120)
      }
    }
    // STORM SOVEREIGN — clouds. Circles the player. P1: thunder grid + curving gale feathers. P2: blink-strikes. P3: Eye of the Storm (closing ring with one gap).
    function stormAI(e, dx, dy, l, dt) {
      const g = G,
        p = g.p,
        ph = bossPhase(e, ['THE STORM SOVEREIGN SPLITS THE SKY!', 'EYE OF THE STORM!'], '#9fd3ff');
      if (e.hide > 0) {
        e.hide -= dt;
        if (e.hide <= 0) {
          e.x = e.bx;
          e.y = e.by;
          const n = ph === 3 ? 20 : 16;
          for (let i = 0; i < n; i++) {
            const a = i * 6.283 / n;
            g.eb.push({
              x: e.x,
              y: e.y,
              vx: Math.cos(a) * 120,
              vy: Math.sin(a) * 120,
              r: 5,
              dmg: 14,
              l: 4,
              c: '#cfe6ff'
            })
          }
          ringFx(e.x, e.y, '#fff', 90);
          shake = 8;
          noise(.3, .15)
        }
        return
      }
      const want = ph === 3 ? 190 : 135,
        ang = Math.atan2(-dy, -dx) + dt * (ph === 1 ? .6 : .9);
      const tx = p.x + Math.cos(ang) * want,
        ty = p.y + Math.sin(ang) * want;
      const mx = tx - e.x,
        my = ty - e.y,
        ml = Math.hypot(mx, my) || 1;
      const v = Math.min(ml / dt, e.spd * (ph === 3 ? 1.5 : 1.2));
      e.x += mx / ml * v * dt;
      e.y += my / ml * v * dt;
      if (e.atk > 0) return;
      const pats = ph === 1 ? ['grid', 'gale'] : ph === 2 ? ['blink', 'grid', 'gale'] : ['eye', 'blink', 'grid', 'gale'];
      const k = pats[(e.seq++) % pats.length];
      e.atk = ph === 1 ? 2.9 : ph === 2 ? 2.5 : 2.2;
      const vw = W / Z / 2 + 20,
        vh = H / Z / 2 + 20;
      if (k === 'grid') {
        const vert = (e.seq & 1) === 0,
          o = rnd(-30, 30);
        for (let i = -2; i <= 2; i++) {
          if (vert) tele({
            k: 'l',
            x: p.x + i * 80 + o,
            y: p.y - vh,
            x2: p.x + i * 80 + o,
            y2: p.y + vh,
            w: 26,
            T: 1.05 + Math.abs(i) * .12,
            dmg: 20,
            c: '#ff9a1a',
            snd: () => {
              noise(.12, .12);
              tone(1400, .12, 'square', .03, -1200)
            }
          });
          else tele({
            k: 'l',
            x: p.x - vw,
            y: p.y + i * 80 + o,
            x2: p.x + vw,
            y2: p.y + i * 80 + o,
            w: 26,
            T: 1.05 + Math.abs(i) * .12,
            dmg: 20,
            c: '#ff9a1a',
            snd: () => {
              noise(.12, .12);
              tone(1400, .12, 'square', .03, -1200)
            }
          })
        }
        if (ph >= 2) e.atk += .6
      } else if (k === 'gale') {
        const n = ph === 1 ? 8 : 12,
          a0 = Math.atan2(dy, dx);
        for (let i = 0; i < n; i++) {
          const a = a0 + (i - (n - 1) / 2) * .14;
          g.eb.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(a) * 115,
            vy: Math.sin(a) * 115,
            r: 4.5,
            dmg: 12,
            l: 4.5,
            tw: (i % 2 ? 1 : -1) * .9,
            c: '#ffffff'
          })
        }
        tone(900, .4, 'sine', .05, -600)
      } else if (k === 'blink') {
        const a = Math.atan2(p.y - e.y, p.x - e.x) + Math.PI + rnd(-.6, .6);
        e.bx = p.x + Math.cos(a) * 110;
        e.by = p.y + Math.sin(a) * 110;
        e.hide = .8;
        tele({
          k: 'c',
          x: e.bx,
          y: e.by,
          r: 40,
          T: .8,
          dmg: 22,
          c: '#9fd3ff'
        });
        fx(e.x, e.y, 20, '#fff', 120);
        tone(1200, .3, 'sine', .05, -900)
      } else if (k === 'eye') {
        const n = 30,
          gap = Math.random() * n | 0,
          ox = p.x,
          oy = p.y,
          dir = Math.random() < .5 ? 1 : -1;
        tele({
          k: 'c',
          x: ox,
          y: oy,
          r: 230,
          T: .7,
          dmg: 0,
          c: '#9fd3ff'
        });
        for (let i = 0; i < n; i++) {
          if (Math.abs(i - gap) <= 2 || Math.abs(i - gap) >= n - 2) continue;
          g.eb.push({
            orb: 1,
            ox,
            oy,
            ang: i * 6.283 / n,
            dang: .55 * dir,
            rad: 240,
            drad: 42,
            x: ox,
            y: oy,
            r: 6,
            dmg: 18,
            l: 7,
            c: '#9fd3ff'
          })
        }
        e.atk = 4.2;
        tone(200, 1.2, 'sine', .06, 400)
      }
    }

    function thornS(e, r, fl, b) {
      const t = e.ph;
      if (e.burrow > 0) {
        x.fillStyle = 'rgba(90,58,26,.6)';
        x.beginPath();
        x.ellipse(0, r * .4, r * .8, r * .3, 0, 0, 7);
        x.fill();
        return
      }
      x.save();
      for (let i = 0; i < 6; i++) {
        const a = i * 1.047 + Math.sin(t * 1.5 + i) * .15;
        x.save();
        x.rotate(a);
        x.fillStyle = pal.ink;
        x.beginPath();
        x.ellipse(r * .95, 0, r * .62, r * .34, 0, 0, 7);
        x.fill();
        x.fillStyle = fl ? '#fff' : (e.bph === 3 ? '#ff5a8a' : '#e85a9a');
        x.beginPath();
        x.ellipse(r * .95, 0, r * .56, r * .27, 0, 0, 7);
        x.fill();
        x.restore()
      }
      x.strokeStyle = pal.ink;
      x.lineWidth = 5;
      for (let i = 0; i < 4; i++) {
        const a = i * 1.57 + t * .3;
        x.beginPath();
        x.moveTo(0, 0);
        x.quadraticCurveTo(Math.cos(a + .6) * r * 1.4, Math.sin(a + .6) * r * 1.4, Math.cos(a) * r * 1.9, Math.sin(a) * r * 1.9 + Math.sin(t * 3 + i) * 6);
        x.stroke()
      }
      x.strokeStyle = '#3f8a3a';
      x.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const a = i * 1.57 + t * .3;
        x.beginPath();
        x.moveTo(0, 0);
        x.quadraticCurveTo(Math.cos(a + .6) * r * 1.4, Math.sin(a + .6) * r * 1.4, Math.cos(a) * r * 1.9, Math.sin(a) * r * 1.9 + Math.sin(t * 3 + i) * 6);
        x.stroke()
      }
      x.fillStyle = pal.ink;
      x.beginPath();
      x.arc(0, b, r * .72 + 3, 0, 7);
      x.fill();
      x.fillStyle = fl ? '#fff' : '#3f8a3a';
      x.beginPath();
      x.arc(0, b, r * .72, 0, 7);
      x.fill();
      x.fillStyle = 'rgba(255,255,255,.2)';
      x.beginPath();
      x.arc(-r * .25, b - r * .3, r * .2, 0, 7);
      x.fill();
      x.fillStyle = '#ffe86a';
      x.fillRect(-r * .4, b - r * .2, r * .26, r * .26);
      x.fillRect(r * .14, b - r * .2, r * .26, r * .26);
      x.fillStyle = pal.ink;
      x.fillRect(-r * .32, b - r * .12, r * .12, r * .16);
      x.fillRect(r * .22, b - r * .12, r * .12, r * .16);
      x.fillRect(-r * .25, b + r * .25, r * .5, r * .08);
      const cy = -r * .7 + b;
      x.fillStyle = pal.gold;
      x.strokeStyle = pal.ink;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(-r * .4, cy);
      x.lineTo(-r * .45, cy - r * .5);
      x.lineTo(-r * .2, cy - r * .25);
      x.lineTo(0, cy - r * .6);
      x.lineTo(r * .2, cy - r * .25);
      x.lineTo(r * .45, cy - r * .5);
      x.lineTo(r * .4, cy);
      x.closePath();
      x.fill();
      x.stroke();
      if (e.bph === 2) {
        x.strokeStyle = '#5a3a1a';
        x.lineWidth = 4;
        for (let i = 0; i < 5; i++) {
          const a = Math.PI * .2 + i * Math.PI * .15;
          x.beginPath();
          x.moveTo(Math.cos(a) * r * .6, Math.sin(a) * r * .6);
          x.lineTo(Math.cos(a) * r * 1.3, Math.sin(a) * r * 1.3 + 8);
          x.stroke()
        }
      }
      x.restore()
    }

    function stormS(e, r, fl, b) {
      if (e.hide > 0) {
        x.globalAlpha = .25;
        x.fillStyle = '#fff';
        x.beginPath();
        x.arc(0, 0, r * .6, 0, 7);
        x.fill();
        x.globalAlpha = 1;
        return
      }
      const t = e.ph;
      x.fillStyle = pal.ink;
      const puffs = [
        [0, 0, 1],
        [-.75, .15, .7],
        [.75, .15, .7],
        [-.4, -.45, .6],
        [.4, -.45, .6]
      ];
      for (const [px, py, s] of puffs) {
        x.beginPath();
        x.arc(px * r, py * r + b, s * r + 3, 0, 7);
        x.fill()
      }
      for (const [px, py, s] of puffs) {
        x.fillStyle = fl ? '#fff' : (e.bph === 3 ? '#7a8aa8' : '#e8f2ff');
        x.beginPath();
        x.arc(px * r, py * r + b, s * r, 0, 7);
        x.fill()
      }
      x.fillStyle = 'rgba(120,150,200,.35)';
      x.beginPath();
      x.ellipse(0, r * .45 + b, r * .9, r * .25, 0, 0, 7);
      x.fill();
      const glow = e.bph === 3 ? '#ff6a6a' : '#ffe86a';
      x.fillStyle = glow;
      x.fillRect(-r * .45, -r * .1 + b, r * .3, r * .22);
      x.fillRect(r * .15, -r * .1 + b, r * .3, r * .22);
      x.fillStyle = pal.ink;
      x.fillRect(-r * .55, -r * .22 + b, r * .45, r * .07);
      x.fillRect(r * .1, -r * .22 + b, r * .45, r * .07);
      if (Math.sin(t * 7) > .6) {
        x.strokeStyle = '#ffe86a';
        x.lineWidth = 3;
        x.beginPath();
        x.moveTo(-r * .2, r * .6 + b);
        x.lineTo(-r * .05, r * .95 + b);
        x.lineTo(-r * .25, r * 1.05 + b);
        x.lineTo(0, r * 1.45 + b);
        x.stroke()

    function autopilot() {

          vy += dy * w * 300

      for (const b of g.eb) {
        const dx = p.x - b.x,
          dy = p.y - b.y,
          d = dx * dx + dy * dy;
        if (d < 70 * 70) {
          vx += dx / d * 600;
          vy += dy / d * 600
        }
      }
      for (const q of g.tele || []) {
        if (q.fired) continue;
        if (q.k === 'c') {
          const dx = p.x - q.x,
            dy = p.y - q.y,
            d = Math.hypot(dx, dy) || 1;
          if (d < q.r + 20) {
            vx += dx / d * 4;
            vy += dy / d * 4
          }
        } else {
          const vx2 = q.x2 - q.x,
            vy2 = q.y2 - q.y,
            L = Math.hypot(vx2, vy2) || 1,
            nx = -vy2 / L,
            ny = vx2 / L,
            sd = (p.x - q.x) * nx + (p.y - q.y) * ny;
          if (Math.abs(sd) < q.w / 2 + 24) {
            const sg = sd >= 0 ? 1 : -1;
            vx += nx * sg * 4;
            vy += ny * sg * 4
          }
        }
      }
      let best = null,
        bd = 1e12;
      for (const q of g.gems) {

        if (d < bd) {

          best = q
        }
      }
      if (best && bd < 250 * 250) {
        const l = Math.sqrt(bd) || 1;
        vx += (best.x - p.x) / l * .8;
        vy += (best.y - p.y) / l * .8
      }
      vx += Math.cos(g.t * .3) * .2;
      vy += Math.sin(g.t * .3) * .2;

        x.beginPath();

        x.fill();
        x.fillStyle = pal.ink;
        x.beginPath();
        x.moveTo(-r * .8, -r * .5);
        x.lineTo(-r * .6, -r * 1.5);
        x.lineTo(-r * .2, -r * .8);
        x.moveTo(r * .8, -r * .5);
        x.lineTo(r * .6, -r * 1.5);
        x.lineTo(r * .2, -r * .8);
        x.fill();
        x.fillStyle = '#ffd23f';
        x.fillRect(-r * .5, -r * .2, r * .3, r * .3);
        x.fillRect(r * .2, -r * .2, r * .3, r * .3)
      }
      x.restore()
    }

    function bossS(e) {
      const B = BOSS[e.bi],
        r = e.r,
        fl = e.flash > 0,
        c = fl ? '#fff' : B.c,
        b = Math.sin(e.ph * 4) * 2;
      if (e.bi === 3) return thornS(e, r, fl, b);
      if (e.bi === 4) return stormS(e, r, fl, b);
      if (e.bi === 1) {
        const f = Math.sin(e.ph * 12) * r * .5;
        x.fillStyle = pal.ink;
        x.beginPath();
        x.moveTo(0, 0);
        x.lineTo(-r * 2, -r * .5 - f);
        x.lineTo(-r * 1.2, r * .6);
        x.closePath();
        x.moveTo(0, 0);
        x.lineTo(r * 2, -r * .5 - f);
        x.lineTo(r * 1.2, r * .6);
        x.closePath();
        x.fill()
      }
      x.fillStyle = pal.ink;
      x.beginPath();
      x.ellipse(0, 0, r + 3, r * .9 + 3 + b, 0, 0, 7);
      x.fill();
      x.fillStyle = c;
      x.beginPath();
      x.ellipse(0, 0, r, r * .9 + b, 0, 0, 7);
      x.fill();
      x.fillStyle = 'rgba(255,255,255,.2)';
      x.beginPath();
      x.ellipse(-r * .35, -r * .4, r * .3, r * .15, 0, 0, 7);
      x.fill();
      x.fillStyle = '#fff';
      x.fillRect(-r * .55, -r * .3, r * .35, r * .35);
      x.fillRect(r * .15, -r * .3, r * .35, r * .35);
      x.fillStyle = e.bi === 2 ? '#ff6a1a' : pal.ink;
      x.fillRect(-r * .45, -r * .2, r * .18, r * .22);
      x.fillRect(r * .25, -r * .2, r * .18, r * .22);
      x.fillStyle = pal.ink;
      x.fillRect(-r * .65, -r * .45, r * .5, r * .08);
      x.fillRect(r * .15, -r * .45, r * .5, r * .08);
      x.fillRect(-r * .3, r * .3, r * .6, r * .1);
      const cy = -r * .8 + b;
      x.fillStyle = pal.gold;
      x.strokeStyle = pal.ink;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(-r * .5, cy);
      x.lineTo(-r * .55, cy - r * .6);
      x.lineTo(-r * .25, cy - r * .3);
      x.lineTo(0, cy - r * .75);
      x.lineTo(r * .25, cy - r * .3);
      x.lineTo(r * .55, cy - r * .6);
      x.lineTo(r * .5, cy);
      x.closePath();
      x.fill();
      x.stroke()
    }

    function gemS(q) {
      const gc = q.k === 'gold' ? '255,210,63' : q.k === 'heart' ? '232,71,58' : q.k === 'chest' ? '255,210,63' : q.k === 'magnet' ? '200,69,47' : q.k === 'big' ? '255,107,90' : q.k === 'mid' ? '95,174,122' : '106,176,255';
      const gr = (q.k === 'chest' ? 20 : q.k === 'big' ? 13 : 9) * (1 + .15 * Math.sin(clock * 6 + q.x));
      x.fillStyle = 'rgba(' + gc + ',.28)';
      x.beginPath();
      x.arc(q.x, q.y, gr, 0, 7);
      x.fill();
      x.save();
      x.translate(q.x, q.y + Math.sin(clock * 5 + q.x) * 2.2);
      x.scale(1.25, 1.25);
      if (q.k === 'gold') {
        const s = Math.abs(Math.cos(clock * 5 + q.y));
        x.scale(Math.max(.2, s), 1);
        x.fillStyle = pal.ink;
        x.beginPath();
        x.arc(0, 0, 5, 0, 7);
        x.fill();
        x.fillStyle = pal.gold;
        x.beginPath();
        x.arc(0, 0, 4, 0, 7);
        x.fill()
      } else if (q.k === 'heart') {
        x.fillStyle = pal.ink;
        x.fillRect(-5, -4, 10, 7);
        x.fillStyle = '#e8473a';
        x.fillRect(-4, -3, 3, 3);
        x.fillRect(1, -3, 3, 3);
        x.fillRect(-4, -1, 8, 2);
        x.fillRect(-2, 1, 4, 2)
      } else if (q.k === 'chest') {
        x.fillStyle = pal.ink;
        x.fillRect(-9, -7, 18, 14);
        x.fillStyle = '#9c6a12';
        x.fillRect(-8, -6, 16, 12);
        x.fillStyle = pal.gold;
        x.fillRect(-8, -2, 16, 2);
        x.fillRect(-2, -3, 4, 5);
        x.globalAlpha = .4 + .3 * Math.sin(clock * 6);
        x.strokeStyle = pal.gold;
        x.lineWidth = 2;
        x.strokeRect(-12, -10, 24, 20);
        x.globalAlpha = 1
      } else if (q.k === 'magnet') {
        x.strokeStyle = pal.ink;
        x.lineWidth = 5;
        x.beginPath();
        x.arc(0, 0, 5, Math.PI, 0);
        x.stroke();
        x.strokeStyle = '#c8452f';
        x.lineWidth = 3;
        x.beginPath();
        x.arc(0, 0, 5, Math.PI, 0);
        x.stroke();
        x.fillStyle = '#ddd';
        x.fillRect(-6.5, 0, 3, 3);
        x.fillRect(3.5, 0, 3, 3)
      } else {
        const s = q.k === 'big' ? 6 : q.k === 'mid' ? 4.5 : 3.5,
          c = q.k === 'big' ? '#ff6b5a' : q.k === 'mid' ? '#5fae7a' : '#6ab0ff';
        x.rotate(Math.PI / 4);
        x.fillStyle = pal.ink;
        x.fillRect(-s - 1, -s - 1, 2 * s + 2, 2 * s + 2);
        x.fillStyle = c;
        x.fillRect(-s, -s, 2 * s, 2 * s);
        x.fillStyle = 'rgba(255,255,255,.6)';
        x.fillRect(-s, -s, s * .8, s * .8)
      }
      x.restore()
    }

    function icon(kind, k, cx, cy, r) {
      x.save();
      x.translate(cx, cy);
      const col = kind === 'p' ? PS[k].c : kind === 'm' ? (k === 'dash' ? '#7a5acd' : '#9c6a12') : (WP[k] || {}).c || '#ffd23f';
      x.fillStyle = pal.ink;
      x.beginPath();
      x.arc(0, 0, r + 2 * U, 0, 7);
      x.fill();
      x.fillStyle = col;
      x.beginPath();
      x.arc(0, 0, r, 0, 7);
      x.fill();
      x.fillStyle = 'rgba(255,255,255,.25)';
      x.beginPath();
      x.arc(-r * .3, -r * .3, r * .4, 0, 7);
      x.fill();
      const s = r / 10;
      x.fillStyle = pal.ink;
      x.strokeStyle = pal.ink;
      x.lineWidth = 2 * s;
      const m = {
        bolt: () => {
          x.fillRect(-1 * s, -6 * s, 2 * s, 12 * s);
          x.fillStyle = pal.paper;
          x.beginPath();
          x.arc(0, -6 * s, 3 * s, 0, 7);
          x.fill()
        },
        orb: () => {
          for (let i = 0; i < 3; i++) {
            x.beginPath();
            x.arc(Math.cos(i * 2.1) * 5 * s, Math.sin(i * 2.1) * 5 * s, 2.5 * s, 0, 7);
            x.fill()
          }
        },
        rain: () => {
          for (let i = 0; i < 3; i++) x.fillRect((-5 + i * 4) * s, (-5 + (i % 2) * 4) * s, 2 * s, 4 * s);
          x.fillRect(-6 * s, 4 * s, 12 * s, 2 * s)
        },
        aura: () => {
          x.beginPath();
          x.arc(0, 0, 6 * s, 0, 7);
          x.stroke();
          x.beginPath();
          x.arc(0, 0, 2.5 * s, 0, 7);
          x.fill()
        },
        boom: () => {
          x.beginPath();
          x.moveTo(-6 * s, 3 * s);
          x.lineTo(-6 * s, -4 * s);
          x.lineTo(-3 * s, -1 * s);
          x.lineTo(0, -5 * s);
          x.lineTo(3 * s, -1 * s);
          x.lineTo(6 * s, -4 * s);
          x.lineTo(6 * s, 3 * s);
          x.fill()
        },
        zap: () => {
          x.beginPath();
          x.moveTo(2 * s, -7 * s);
          x.lineTo(-4 * s, 1 * s);
          x.lineTo(0, 1 * s);
          x.lineTo(-2 * s, 7 * s);
          x.lineTo(4 * s, -1 * s);
          x.lineTo(0, -1 * s);
          x.fill()
        },
        might: () => {
          x.fillRect(-1 * s, -7 * s, 2 * s, 10 * s);
          x.fillRect(-4 * s, 2 * s, 8 * s, 2 * s);
          x.fillRect(-1 * s, 4 * s, 2 * s, 3 * s)
        },
        tome: () => {
          x.fillRect(-5 * s, -6 * s, 10 * s, 12 * s);
          x.fillStyle = pal.paper;
          x.fillRect(-3 * s, -4 * s, 6 * s, 1.5 * s);
          x.fillRect(-3 * s, -1 * s, 6 * s, 1.5 * s)
        },
        magnet: () => {
          x.lineWidth = 3 * s;
          x.beginPath();
          x.arc(0, 0, 5 * s, Math.PI, 0);
          x.stroke();
          x.fillRect(-6.5 * s, 0, 3 * s, 4 * s);
          x.fillRect(3.5 * s, 0, 3 * s, 4 * s)
        },
        area: () => {
          x.beginPath();
          x.arc(0, 0, 6 * s, 0, 7);
          x.stroke();
          x.beginPath();
          x.arc(0, 0, 3 * s, 0, 7);
          x.stroke()
        },
        armor: () => {
          x.beginPath();
          x.moveTo(-6 * s, -6 * s);
          x.lineTo(6 * s, -6 * s);
          x.lineTo(5 * s, 2 * s);
          x.lineTo(0, 7 * s);
          x.lineTo(-5 * s, 2 * s);
          x.fill()
        },
        boots: () => {
          x.fillRect(-3 * s, -6 * s, 4 * s, 9 * s);
          x.fillRect(-3 * s, 3 * s, 8 * s, 3 * s)
        },
        luck: () => {
          for (let i = 0; i < 4; i++) {
            x.beginPath();
            x.arc(Math.cos(i * 1.57) * 3.5 * s, Math.sin(i * 1.57) * 3.5 * s, 3 * s, 0, 7);
            x.fill()
          }
        },
        heart: () => {
          x.fillRect(-5 * s, -4 * s, 4 * s, 4 * s);
          x.fillRect(1 * s, -4 * s, 4 * s, 4 * s);
          x.fillRect(-5 * s, -1 * s, 10 * s, 3 * s);
          x.fillRect(-3 * s, 2 * s, 6 * s, 2 * s);
          x.fillRect(-1 * s, 4 * s, 2 * s, 2 * s)
        },
        gold: () => {
          x.beginPath();
          x.arc(0, 0, 5 * s, 0, 7);
          x.fill()
        },
        heal: () => m.heart(),
        dash: () => {
          x.lineWidth = 2.2 * s;
          x.beginPath();
          x.moveTo(-5 * s, -6 * s);
          x.lineTo(1 * s, 0);
          x.lineTo(-5 * s, 6 * s);
          x.moveTo(1 * s, -6 * s);
          x.lineTo(7 * s, 0);
          x.lineTo(1 * s, 6 * s);
          x.stroke()
        },
        walls: () => {
          x.fillRect(-7 * s, -2 * s, 6 * s, 7 * s);
          x.fillRect(1 * s, -6 * s, 6 * s, 4 * s);
          x.fillRect(1 * s, 2 * s, 6 * s, 4 * s)
        }
      };
      (m[k] || m.gold)();
      x.restore()
    }
    // ===== draw world =====
    function edgePt(m) {
      const p = G.p,
        hw = W / Z / 2 + m,
        hh = H / Z / 2 + m,
        per = 2 * (hw + hh),
        r = vrand() * per;
      let ex, ey;
      if (r < 2 * hw) {
        ex = -hw + r;
        ey = vrand() < .5 ? -hh : hh
      } else {
        ey = -hh + (r - 2 * hw);
        ex = vrand() < .5 ? -hw : hw
      }
      return [p.x + ex, p.y + ey]
    }

    function arrowAt(p, tx, ty, hw, hh, col, sz) {
      const dx = tx - p.x,
        dy = ty - p.y;
      const t = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6));
      const ax = p.x + dx * t,
        ay = p.y + dy * t,
        a = Math.atan2(dy, dx);
      x.save();
      x.translate(ax, ay);
      x.rotate(a);
      x.fillStyle = col;
      x.strokeStyle = pal.ink;
      x.lineWidth = 2;
      x.beginPath();
      x.moveTo(sz, 0);
      x.lineTo(-sz * .6, -sz * .7);
      x.lineTo(-sz * .6, sz * .7);
      x.closePath();
      x.fill();
      x.stroke();
      x.restore()
    }

    function offInd(p, hw, hh) {
      const out = e => Math.abs(e.x - p.x) > hw + 14 || Math.abs(e.y - p.y) > hh + 14;
      const near = [];
      for (const e of G.en) {
        if (!out(e)) continue;
        if (e.boss || e.elite) continue;
        near.push([d2(e, p), e])
      }
      near.sort((a, b) => a[0] - b[0]);
      x.globalAlpha = .55 + .2 * Math.sin(clock * 6);
      for (const [, e] of near.slice(0, 10)) arrowAt(p, e.x, e.y, hw, hh, '#ff6b5a', 6);
      x.globalAlpha = 1;
      for (const e of G.en)
        if ((e.elite || e.boss) && out(e)) arrowAt(p, e.x, e.y, hw, hh, e.boss ? '#ff6a1a' : '#ff8a3d', e.boss ? 13 : 10);
      for (const q of G.gems)
        if (q.k === 'chest' && out(q)) {
          arrowAt(p, q.x, q.y, hw, hh, '#ffd23f', 11)
        }
    }

    function drawWorld() {
      const g = G,
        p = g.p,
        ph = PHASE[Math.min(PHASE.length - 1, g.phase)];
      const Zo = Z * (1 - .15 * zoomT);
      x.save();
      const sx = (vrand() - .5) * shake * U,
        sy = (vrand() - .5) * shake * U;
      x.translate(W / 2 + sx, H / 2 + sy);
      x.scale(Zo, Zo);
      x.translate(-p.x, -p.y);
      const vw = W / Zo / 2 + 40,
        vh = H / Zo / 2 + 40,
        T = 48;
      x.fillStyle = ph.g;
      x.fillRect(p.x - vw, p.y - vh, vw * 2, vh * 2);
      for (let tx = Math.floor((p.x - vw) / T); tx <= (p.x + vw) / T; tx++)
        for (let ty = Math.floor((p.y - vh) / T); ty <= (p.y + vh) / T; ty++) {
          const h = ((tx * 73856093) ^ (ty * 19349663)) >>> 0;
          if ((tx + ty) & 1) {
            x.fillStyle = ph.g2;
            x.fillRect(tx * T, ty * T, T, T)
          }
          if (h % 5 === 0) {
            x.fillStyle = ph.tuft;
            x.fillRect(tx * T + h % 30, ty * T + (h >> 5) % 30, 2, 6);
            x.fillRect(tx * T + h % 30 + 3, ty * T + (h >> 5) % 30 + 2, 2, 4)
          }
          if (h % 7 === 0) {
            x.fillStyle = ph.dot;
            x.globalAlpha = g.phase === 2 ? .5 + .4 * Math.sin(clock * 3 + tx) : .6;
            x.fillRect(tx * T + (h >> 3) % 40, ty * T + (h >> 7) % 40, 3, 3);
            x.globalAlpha = 1
          }
          if (ph.leaf && h % 11 === 0) {
            x.fillStyle = '#24481f';
            const lx = tx * T + (h >> 4) % 36,
              ly = ty * T + (h >> 9) % 36;
            x.beginPath();
            x.ellipse(lx, ly, 9, 4, (h % 6) / 2, 0, 7);
            x.fill();
            x.fillStyle = '#3d7a32';
            x.beginPath();
            x.ellipse(lx + 1, ly - 1, 7, 2.5, (h % 6) / 2, 0, 7);
            x.fill()
          }
          if (ph.cloud && h % 9 === 0) {
            x.fillStyle = 'rgba(255,255,255,.55)';
            const cx2 = tx * T + (h >> 4) % 30,
              cy2 = ty * T + (h >> 9) % 30;
            x.beginPath();
            x.arc(cx2, cy2, 9, 0, 7);
            x.arc(cx2 + 10, cy2 + 2, 7, 0, 7);
            x.arc(cx2 - 9, cy2 + 3, 6, 0, 7);
            x.fill()
          }
        }
      drawTele();
      for (const q of g.pools) {
        const a = Math.min(1, q.l * 2);
        x.globalAlpha = .45 * a;
        x.fillStyle = q.slow ? '#ffd23f' : '#ffb13d';
        x.beginPath();
        x.arc(q.x, q.y, q.r, 0, 7);
        x.fill();
        x.globalAlpha = .8 * a;
        x.strokeStyle = '#e0a526';
        x.lineWidth = 2;
        x.stroke();
        for (let i = 0; i < 4; i++) {
          x.fillStyle = pal.paper;
          x.fillRect(q.x + Math.cos(clock * 3 + i * 1.6) * q.r * .6, q.y + Math.sin(clock * 4 + i) * q.r * .5, 2, 2)
        }
        x.globalAlpha = 1
      }
      if (g.auraR) {
        x.globalAlpha = .18 + .06 * Math.sin(clock * 6);
        x.fillStyle = g.evo.aura ? '#ffd23f' : '#ff6b5a';
        x.beginPath();
        x.arc(p.x, p.y, g.auraR, 0, 7);
        x.fill();
        x.globalAlpha = .5;
        x.strokeStyle = x.fillStyle;
        x.lineWidth = 1.5;
        x.setLineDash([4, 4]);
        x.lineDashOffset = -clock * 20;
        x.stroke();
        x.setLineDash([]);
        x.globalAlpha = 1
      }
      for (const w of g.walls || []) {
        x.save();
        x.globalAlpha = Math.min(1, Math.max(0, w.l)) * Math.max(.3, w.hp / w.mhp);
        x.lineCap = 'round';
        if (w.laser) {
          const fl = .7 + .3 * Math.sin(clock * 30);
          x.strokeStyle = 'rgba(110,190,255,.35)';
          x.lineWidth = w.th * 1.9;
          x.beginPath();
          x.moveTo(w.x1, w.y1);
          x.lineTo(w.x2, w.y2);
          x.stroke();
          x.strokeStyle = 'rgba(159,211,255,' + (.55 * fl) + ')';
          x.lineWidth = w.th;
          x.beginPath();
          x.moveTo(w.x1, w.y1);
          x.lineTo(w.x2, w.y2);
          x.stroke();
          x.strokeStyle = 'rgba(255,255,255,' + fl + ')';
          x.lineWidth = w.th * .38;
          x.beginPath();
          x.moveTo(w.x1, w.y1);
          x.lineTo(w.x2, w.y2);
          x.stroke();
          x.fillStyle = '#9fd3ff';
          for (const q of [
              [w.x1, w.y1],
              [w.x2, w.y2]
            ]) {
            x.beginPath();
            x.arc(q[0], q[1], w.th * .9, 0, 7);
            x.fill()
          }
        } else {
          x.lineCap = 'butt';
          x.strokeStyle = pal.ink;
          x.lineWidth = w.th + 4;
          x.beginPath();
          x.moveTo(w.x1, w.y1);
          x.lineTo(w.x2, w.y2);
          x.stroke();
          x.strokeStyle = '#a8875a';
          x.lineWidth = w.th;
          x.beginPath();
          x.moveTo(w.x1, w.y1);
          x.lineTo(w.x2, w.y2);
          x.stroke();
          const vx2 = w.x2 - w.x1,
            vy2 = w.y2 - w.y1,
            L2 = Math.hypot(vx2, vy2) || 1,
            ux = vx2 / L2,
            uy = vy2 / L2,
            nx2 = -uy,
            ny2 = ux;
          x.strokeStyle = 'rgba(59,42,26,.5)';
          x.lineWidth = 2;
          const nseg = Math.max(2, Math.floor(L2 / 12));
          for (let s2 = 1; s2 < nseg; s2++) {
            const mx2 = w.x1 + ux * L2 * s2 / nseg,
              my2 = w.y1 + uy * L2 * s2 / nseg;
            x.beginPath();
            x.moveTo(mx2 + nx2 * w.th * .38, my2 + ny2 * w.th * .38);
            x.lineTo(mx2 - nx2 * w.th * .38, my2 - ny2 * w.th * .38);
            x.stroke()
          }
        }
        x.restore()
      }
      if (g.wallDraw && md('walls')) {
        x.strokeStyle = 'rgba(120,230,170,' + (.35 + .25 * Math.sin(clock * 8)) + ')';
        x.lineWidth = 2;
        x.setLineDash([5, 5]);
        x.beginPath();
        x.arc(p.x, p.y, 17, 0, 7);
        x.stroke();
        x.setLineDash([])
      }
      for (const q of g.gems)
        if (Math.abs(q.x - p.x) < vw && Math.abs(q.y - p.y) < vh) gemS(q);
      const vis = g.en.filter(e => Math.abs(e.x - p.x) < vw && Math.abs(e.y - p.y) < vh).sort((a, b) => a.y - b.y);
      for (const e of vis) enemyS(e);
      // Death cinematic rendering
      if (g.deathCinematic) {
        const dc = g.deathCinematic;
        const progress = dc.t / dc.duration;
        // Apply zoom
        const deathZoom = dc.zoomStart + (dc.zoomEnd - dc.zoomStart) * progress;
        x.save();
        x.translate(p.x, p.y);
        x.scale(deathZoom, deathZoom);
        x.rotate(dc.tipAngle);
        x.translate(-p.x, -p.y);
        // Red tint overlay
        const redAlpha = Math.min(0.7, progress * 1.2);
        x.globalAlpha = redAlpha;
        x.fillStyle = '#ff0000';
        x.fillRect(p.x - W, p.y - H, W * 2, H * 2);
        x.globalAlpha = 1;
        // Draw player tipped over
        heroS(p.x, p.y, g.char, 1, p.walk, p.face, false);
        x.restore();
      } else if (!(p.inv > 0 && Math.sin(clock * 50) > 0)) {
        heroS(p.x, p.y, g.char, 1, p.walk, p.face, (clock % 3.2) < .1);
      }
      // Low HP red flash indicator - tint the hero sprite

      for (const b of g.eb) {

        x.fillStyle = bc;
        x.beginPath();
        x.arc(b.x, b.y, b.r, 0, 7);
        x.fill();
        x.fillStyle = '#ffd23f';

        x.arc(b.x - 1, b.y - 1, b.r * .45, 0, 7);

      }
      for (const b of g.bolts) {

        }

        x.beginPath();
        x.arc(b.x, b.y, 14, 0, 7);

      }
      for (const f of g.fx) {

    function drawMinimap() {
      if (!G || !G.p || !minimapOn) return;
      const g = G, p = g.p;
      const mm = 120 * U, mmt = 120 * U;
      const mx = W - mm - 10 * U, my = 60 * U + (typeof SAT !== 'undefined' ? SAT : 0);

      x.lineWidth = 1 * U;
      rr(mx, my, mm, mmt, 4 * U, 'rgba(0,0,0,0)');
      // scale
      const sc = mm / 800;
      // player
      x.fillStyle = '#ffd23f';
      x.beginPath();
      x.arc(mx + mm/2 + p.x * sc * 0.1, my + mmt/2 + p.y * sc * 0.1, 2 * U, 0, 7);

        x.arc(mx + mm/2 + e.x * sc * 0.1, my + mmt/2 + e.y * sc * 0.1, 1.2 * U, 0, 7);
        x.fill();
      }

      x.fillStyle = '#6ab0ff';
      for (let i = 0; i < Math.min(g.gems.length, 30); i++) {
        const ge = g.gems[i];
        x.beginPath();
        x.arc(mx + mm/2 + ge.x * sc * 0.1, my + mmt/2 + ge.y * sc * 0.1, 1 * U, 0, 7);
        x.fill();
      }
      // boss
      if (g.boss) {
        x.fillStyle = '#ff4d4d';
        x.beginPath();
        x.arc(mx + mm/2 + g.boss.x * sc * 0.1, my + mmt/2 + g.boss.y * sc * 0.1, 3 * U, 0, 7);

      }
    }

  let simAccum = 0;
  function loop(t) {
    let realDt = Math.max(0, Math.min(.1, (t - t0) / 1000));
    t0 = t;
    const scale = window.simTimeScale || 1;
    const FIXED = 1 / 60;
    // Determine how much simulation time to consume this frame.
    // Fixed small steps keep physics/collisions accurate even at high speed,
    // which matters for the build analyzer / balance analysis.
    let target;
    if (scale >= 999) {
      target = 200 * FIXED; // MAX: fixed 200 steps/frame (~3.3s game-time)
    } else if (scale >= 100) {
      target = 100 * FIXED; // ~100x realtime, still accurate
    } else {
      target = realDt * scale;
    }
    // Handle step mode
    if (window.simStepMode) {
      target = Math.min(target, FIXED);
      window.simStepMode = false;
      if (G) G.paused = true;
    }
    simAccum += target;
    let steps = Math.floor(simAccum / FIXED);
    if (steps > 600) steps = 600; // safety cap
    simAccum -= steps * FIXED;
    let simDt = 0;
    for (let j = 0; j < steps; j++) {
      // Stop precisely at the analysis time limit instead of overshooting it.
      if (window.simTimeLimit && typeof G !== 'undefined' && G && scene === 'play' && !G.over && G.t >= window.simTimeLimit) {
        G.paused = true;
        if (!window.simLimitSent) {
          window.simLimitSent = true;
          sendGameState();
        }
        break;
      }
      for (let i = 0; i < speedMul; i++) update(FIXED);
      simDt += FIXED * speedMul;
      if (window.simDbg) { window.simDbg.steps = (window.simDbg.steps || 0) + 1; }
    }
    // Record replay
    if (replayRecording && scene === 'play' && typeof G !== 'undefined' && G && G.p) {
      if (!replayData) replayData = [];
      if (replayData.length > 5000) replayData.shift();
      replayData.push({t: G.t, x: G.p.x, y: G.p.y, hp: G.p.hp, kills: G.kills, lvl: G.lvl});
    }
    if (window.simDbg) window.simDbg.draws = (window.simDbg.draws || 0) + 1;
    if (window.simRender !== false) draw();
    // Send state updates periodically
    if (!window.simStateTimer) window.simStateTimer = 0;
    if (!window.simStateWall) window.simStateWall = 0;
    window.simStateTimer += simDt;
    const nowWall = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    // Throttle to ~12 updates/sec of wall time even at very high time scales,
    // so the simulator/analyzer isn't flooded by postMessage traffic.
    if (window.simStateTimer >= 0.2 && nowWall - window.simStateWall >= 80) {
      window.simStateTimer = 0;
      window.simStateWall = nowWall;
      sendGameState();
    }
    requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop);
