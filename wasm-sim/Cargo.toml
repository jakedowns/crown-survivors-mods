[package]
name = "crown-sim-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Authoritative, deterministic, render-agnostic Crown Survivors simulation core (native + WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
