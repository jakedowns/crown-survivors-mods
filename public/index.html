    if (e < 0) return;
    if (!R.burst) {
      R.burst = 1;
      sfx.buy();
      vib([20, 20, 20, 20, 60]);
      const cf = ['#ffd23f', '#c8452f', '#5fae7a', '#6ab0ff', '#c9a0ff', '#fff3c4'],
        cx = lbT.ox + 195 * lbT.k,
        cy = lbT.oy + 250 * lbT.k;
      for (let i = 0; i < 34; i++) {
        const a = Math.random() * 6.28,
          v = 80 + Math.random() * 180;
        uiParts.push({
          x: cx,
          y: cy,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v - 120,
          l: 1.2 + Math.random() * .8,
          c: cf[i % 6]
        })
      }
    }
    btns.push({
      x: 0,
      y: -200,
      w: 390,
      h: 1244,
      k: 'rankbg',
      f: () => {
        if (e > .8) {
          lb.rank = null;
          lb.t0 = clock
        }
      }
    });
    x.fillStyle = 'rgba(20,12,5,' + (.78 * Math.min(1, e / .2)) + ')';
    x.fillRect(-400, -400, 1200, 1700);
    const cx = 195,
      cy = 250;
    x.save();
    x.translate(cx, cy);
    x.rotate(clock * .6);
    for (let i = 0; i < 12; i++) {
      x.rotate(Math.PI / 6);
      x.beginPath();
      x.moveTo(0, 0);
      x.lineTo(-18, -230);
      x.lineTo(18, -230);
      x.closePath();
      x.fillStyle = i % 2 ? 'rgba(255,210,63,.20)' : 'rgba(255,243,196,.10)';
      x.fill()
    }
    x.restore();
    const sc = e < .25 ? 1.15 * e / .25 : e < .35 ? 1.15 - .15 * (e - .25) / .1 : 1;
    x.save();
    x.translate(cx, cy);
    x.scale(sc, sc);
    x.translate(-cx, -cy);
    x.beginPath();
    x.arc(cx, cy, 64, 0, 7);
    x.fillStyle = 'rgba(255,210,63,.18)';
    x.fill();
    x.beginPath();
    x.arc(cx, cy + 4, 52, 0, 7);
    x.fillStyle = 'rgba(0,0,0,.35)';
    x.fill();
    x.beginPath();
    x.arc(cx, cy, 52, 0, 7);
    x.fillStyle = '#ffd23f';
    x.fill();
    x.lineWidth = 4;
    x.strokeStyle = LINK;
    x.stroke();
    x.beginPath();
    x.arc(cx, cy, 42, 0, 7);
    x.lineWidth = 3;
    x.strokeStyle = '#e0a526';
    x.stroke();
    crown(cx, cy - 60, 52, '#ffd23f');
    heroAt(cx, cy + 4, R.row ? heroIx(R.row.hero) : S.char, 3.2, clock * 8);
    x.restore();
    [
      [70, 150, 7],
      [318, 170, 9],
      [60, 330, 6],
      [330, 320, 8],
      [110, 90, 5],
      [285, 95, 6],
      [40, 240, 5],
      [350, 250, 6]
    ].forEach(([a, b2, r], i) => {
      x.globalAlpha = .4 + .6 * Math.abs(Math.sin(clock * 3 + i * 1.3));
      starShape(a, b2, r, pal.paper);
      x.globalAlpha = 1
    });
    if (e > .2) pix('NEW RANK', 195, 372, 30, pal.gold, 2.5, '#e0a526');
    if (e > .3) pix('#' + R.n + '!', 195, 432, 40, pal.paper, 2.5, '#e9c27f');
    if (e > .6) {
      x.globalAlpha = Math.min(1, (e - .6) / .3);
      txt(R.from == null ? 'FIRST TIME ON THE BOARD' : 'UP ' + (R.from - R.n) + ' PLACE' + (R.from - R.n > 1 ? 'S' : '') + '  ·  FROM #' + R.from, 195, 486, 13, '#7dff6a');
      x.globalAlpha = 1
    }
    if (R.row) lbRow(512, 46, R.n, R.row, true, lb.board);
    if (e > 1.6) txt('tap to continue', 195, 600, 11, pal.paper)
  }

  function drawCard() {
    const C = lbCard,
      sc = C.sc,
      e = Math.max(0, clock - C.t0);
    x.fillStyle = 'rgba(30,20,10,.6)';
    x.fillRect(0, 0, W, H);
    btns.push({
      x: 0,
      y: 0,
      w: W,
      h: H,
      k: 'cardbg',
      f: () => {}
    });
    lbBegin();
    rr(13, 73, 364, 726, 16, 'rgba(0,0,0,.35)');
    rr(13, 67, 364, 726, 16, '#f3e2b8', LINK, 4);
    rr(21, 75, 348, 710, 10, null, '#c9a66b', 2);
    pix('NEW BEST!', 195, 112, 26, pal.gold, 2.5, '#e0a526');
    txt((sc.won ? 'VICTORY' : 'DEFEATED') + '  ·  CURSE ' + sc.curse, 195, 150, 13, sc.won ? '#c8452f' : '#8b3a2a', 'center', false);
    for (let i = 0; i < 5; i++) {
      const a = clock * 2 + i * 1.2566 + .3,
        R = 46;
      starShape(195 + Math.cos(a) * R, 212 + Math.sin(a) * R * .5, 4 + (i % 2) * 2, pal.gold)
    }
    heroAt(195, 214, sc.ci, 3, clock * 8);
    rr(37, 266, 316, 128, 12, '#e9d3a0', LINK, 2);
    x.fillStyle = '#c9a66b';
    x.fillRect(195, 278, 2, 72);
    x.fillRect(53, 314, 284, 2);
    const k1 = Math.min(1, e / .6),
      k2 = Math.max(0, Math.min(1, (e - .6) / .6)),
      np = Math.max(0, Math.min(sc.bosses, Math.floor((e - 1.2) / .08) + 1));
    txt(sc.won ? 'WIN TIME' : 'SURVIVED', 116, 284, 10, '#8b6a3a', 'center', false);
    txt(fmtT(sc.time_s * k1), 116, 300, 18, LINK, 'center', false);
    txt('BOSSES', 274, 284, 10, '#8b6a3a', 'center', false);
    pips(250, 301, e > 1.2 ? np : 0);
    txt('KILLS', 116, 330, 10, '#8b6a3a', 'center', false);
    txt(fmtN(Math.floor(sc.kills * k2)), 116, 346, 16, LINK, 'center', false);
    txt('HERO', 274, 330, 10, '#8b6a3a', 'center', false);
    txt(CH[sc.ci].n, 274, 346, 14, LINK, 'center', false);
    const P = C.prev,
      rk = LBS.ranks[C.b] ? ' · #' + LBS.ranks[C.b] : '';
    const pv = C.b === 'fastest' ? (P.f ? 'Previous best ' + fmtT(P.f[1]) + ' · curse ' + P.f[0] + rk : 'Your first win!') : C.b === 'survival' ? (P.s ? 'Previous best ' + fmtT(P.s) + rk : 'Your first run on the board!') : (P.k ? 'Previous best ' + fmtN(P.k) + ' kills' + rk : 'Your first run on the board!');
    txt(pv, 195, 376, 10, '#5a4030', 'center', false);
    txt('Sign in with X to post your score', 195, 428, 14, LINK, 'center', false);
    txt('We only use your @handle and avatar.', 195, 452, 11, '#5a4030', 'center', false);
    const pl = 1 + Math.sin(clock * 5) * .03;
    x.save();
    x.translate(195, 512);
    x.scale(pl, pl);
    x.translate(-195, -512);
    xButton(70, 484, 250, 56, () => lbSignIn(Object.assign({
      board: C.b
    }, sc)), 18);
    x.restore();
    button('SKIP', 135, 566, 120, 40, () => {
      lbCard = null
    }, '#8b5a2b', 15);
    txt('Skip keeps this best on your device only', 195, 636, 10, '#8b6a3a', 'center', false);
    lbEnd()
  }
  const _drawOver = drawOver; drawOver = function() {
    if (lbCard && lbCard.o === G.over && clock >= lbCard.t0) return drawCard();
    _drawOver();
    const L = G.over && G.over.lb;
    if (L && LB_API) {
      const pl = 1 + Math.sin(clock * 5) * .03,
        bx = W / 2 - 105 * U,
        by = H * .7 - 42 * U;
      x.save();
      x.translate(W / 2, by + 15 * U);
      x.scale(pl, pl);
      x.translate(-W / 2, -(by + 15 * U));
      button('NEW RANK #' + L.n + '!  ▶', bx, by, 210 * U, 30 * U, () => {
        lbShowRank(L)
      }, '#6a5acd', 13);
      x.restore()
    }
  };
  const _drawTitle = drawTitle; drawTitle = function() {
    _drawTitle();
    if (!LB_API) return;
    const y0 = H * .64 + 148 * U,
      lim = H - 44 * U - 9 * U,
      h = Math.max(24 * U, Math.min(40 * U, lim - y0 - 5 * U));
    button('LEADERBOARD', W / 2 - 105 * U, y0, 210 * U, h, () => openLB('title'), '#6a5acd', h < 34 * U ? 12 : 15);
    if (lbIn()) {
      const u = LBS.user,
        X = 106 * U,
        Y = H - 44 * U,
        bw = 56 * U,
        cw = W - 10 * U - bw - 4 * U - X;
      if (cw > 60 * U) {
        rr(X, Y, cw, 30 * U, 10 * U, 'rgba(30,20,10,.78)');
        avatar(X + 15 * U, Y + 15 * U, 10 * U, u.avatar);
        txt(fitTxt(uLbl(u), cw - 36 * U, 10), X + 30 * U, Y + 15 * U, 10, pal.paper, 'left', false)
      }
      button('SIGN OUT', W - 10 * U - bw, Y, bw, 30 * U, lbSignOut, '#6a4a3a', 8)
    }
  }; cv.addEventListener('pointerdown', e => {
    if (scene === 'lb' && !lb.rank && !trans && !(btns.some(b => e.clientX > b.x && e.clientX < b.x + b.w && e.clientY > b.y && e.clientY < b.y + b.h))) lb.drag = {
      y: e.clientY,
      s: lb.scroll
    }
  }); addEventListener('pointermove', e => {
    if (lb.drag) lb.scroll = lb.drag.s - (e.clientY - lb.drag.y) / lbT.k
  }); addEventListener('pointerup', () => {
    lb.drag = null
  }); addEventListener('pointercancel', () => {
    lb.drag = null
  }); cv.addEventListener('wheel', e => {
    if (scene === 'lb') {
      lb.scroll += e.deltaY / lbT.k;
      e.preventDefault()
    }
  }, {
    passive: false
  });
  if (LB_API) {
    const m = location.hash.match(/lb_token=([^&]+)/),
      er = /lb_error=/.test(location.hash);
    if (m || er) {
      try {
        history.replaceState(null, '', location.pathname + location.search)
      } catch (e) {}
    }
    if (m) {
      LBS.tok = decodeURIComponent(m[1]);
      lbSave()
    } else if (er) {
      LBS.pend = null;
      lbSave();
      toast = {
        t: 'Sign-in cancelled',
        l: 1.8
      };
      try {
        sessionStorage.removeItem('cs_sx')
      } catch (e) {}
    }
    if (LBS.tok) lbRefreshMe().then(async () => {
      try {
        if (lbIn() && sessionStorage.getItem('cs_sx')) {
          sessionStorage.removeItem('cs_sx');
        }
      } catch (e) {}
      if (!lbIn() || !LBS.pend) return;
      const p = LBS.pend;
      LBS.pend = null;
      lbSave();
      const res = await lbSubmit(p, p.board);
      if (res) lbShowRank(res);
      else openLB('title', p.board)
    })
  }
  window.__cs = {
    get joy() {
      return joy
    },
    get mt() {
      return mt
    },
    setHp: f => {
      G.p.hp = G.p.mhp * f
    },
    cards: () => cards(),
    INF,
    get btns() {
      return btns
    },
    BOSS,
    spawnBoss: i => {
      G.bossI = i + 1;
      spawnBoss(i)
    },
    setPhase: n => {
      G.phase = n
    },
    setT: t => {
      G.t = t
    },
    get G() {
      return G
    },
    get S() {
      return S
    },
    get scene() {
      return scene
    },
    start: () => {
      scene = 'play';
      startRun()
    },
    auto: (on = true) => {
      G.auto = on
    },
    god: (on = true) => {
      G.god = on
    },
    speed: n => speedMul = n,
    go: s => {
      scene = s
    },
    pickAuto: () => {
      if (G && G.choice) {
        const c = G.choice;
        c.t = 1;
        const cs = c.cards;
        const e = cs.find(q => q.kind === 'e') || cs.find(q => q.kind === 'w' && q.lv > 1) || cs[Math.random() * cs.length | 0];
        choose(e);
        return true
      }
      return false
    },
    addGold: n => {
      S.gold += n;
      save()
    },
    dashNow: () => dashNow(),
    placeWall: () => placeWall(),
    mods: () => S.mods,
    useMod: k => md(k)
  };
})();
</script></body></html>
